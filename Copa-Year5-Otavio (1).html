<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Copa Year 5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: sidebar com os dias de prova + palco central com missões. Visual de estádio de futebol (campo, placar e figurinhas), tema escuro único. */
:root{
  color-scheme:dark;
  --bg:#07140d; --bg2:#0d2216; --panel:#12301f; --panel2:#1a4128; --line:#2f6b46;
  --ink:#f4fff6; --muted:#a9d4b8;
  --pink:#ffc61a; --cyan:#3ddc84; --lime:#c6f432; --violet:#1fa35c; --gold:#ffb703;
  --good:#38e08c; --bad:#ff6b7a;
  --fd:'Unbounded',system-ui,sans-serif; --fb:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 88% -8%,rgba(255,198,26,.26),transparent 60%),radial-gradient(760px 520px at -8% 18%,rgba(61,220,132,.15),transparent 60%);
  background-attachment:fixed;
  color:var(--ink);font:400 18px/1.55 var(--fb);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--fd);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.55rem,3.6vw,2.3rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:10px}
.mono{font-family:ui-monospace,Consolas,monospace;white-space:pre}

.app{display:grid;grid-template-columns:304px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto}
.top{display:none}
.side{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:22px 0 22px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.wm{font-family:var(--fd);font-weight:800;font-size:1.35rem;letter-spacing:.04em;background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:.8rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.me b{font-family:var(--fd);font-size:.95rem}
.nav{display:flex;flex-direction:column;gap:8px}
.navl{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 2px 0}
.day{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:16px;padding:10px 12px;width:100%;text-decoration:none;color:inherit}
.day:hover{background:var(--panel)}
.day.on{background:var(--panel2);border-color:var(--pink)}
.dt{font-family:var(--fd);font-size:.8rem;font-weight:700;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;line-height:1.25}
.dt small{display:block;font-family:var(--fb);font-weight:600;color:var(--muted);font-size:.7rem}
.dn{font-weight:800;line-height:1.25}
.dp{font-size:.82rem;color:var(--muted)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.tag.rec{background:var(--lime);color:#1d2200}
.tag.soon{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.lnk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;text-decoration:none;color:inherit;border:1px solid transparent}
.lnk:hover{background:var(--panel)}
.lnk.on{background:var(--panel2);border-color:var(--cyan)}
.snd{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.snd button{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800}

.main{padding:26px 0 90px;min-width:0}
.kick{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:8px}
.lead{color:var(--muted);max-width:62ch}
.hero{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chp{font-size:.82rem;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 24px;font-weight:800;font-size:1.02rem;color:#08210f;background:linear-gradient(135deg,var(--pink),var(--cyan));box-shadow:0 8px 28px rgba(255,198,26,.35);text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.cy{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#07140d;box-shadow:0 8px 28px rgba(61,220,132,.25)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:800;color:var(--ink);text-decoration:none;display:inline-flex}
.ghost:hover{background:var(--panel)}
.sm{padding:6px 12px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mc{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;min-width:0}
.mc:hover{border-color:var(--pink);transform:translateY(-2px)}
.mc{transition:transform .15s,border-color .15s}
.mc h3{font-size:1rem}
.mc .meta{color:var(--muted);font-size:.85rem}
.mc.boss{background:linear-gradient(160deg,#17391f,#4a3c08);border-color:var(--pink)}
.mc .done{position:absolute;top:14px;right:14px}
.alt{display:none;color:var(--cyan);font-size:.92em;margin-top:4px}
body.alt-on .alt{display:block}
.mc .alt{font-size:.8rem}

.stars{display:inline-flex;gap:2px}
.stars svg{width:20px;height:20px}
.av{flex:none}

/* exercício */
.xc{max-width:780px;display:flex;flex-direction:column;gap:18px}
.xtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pbar{flex:1;min-width:120px;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:99px;transition:width .3s}
.cnt{font-weight:800;color:var(--muted);font-size:.9rem}
.guide{display:flex;align-items:center;gap:12px}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 14px;font-size:.95rem;color:var(--muted)}
.q{font-size:1.25rem;font-weight:800;line-height:1.4}
.q b{color:var(--gold)}
.vis{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}
.vis.txt{display:block;font-weight:600;line-height:1.65}
.bigcoin{padding:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:800;font-size:1.05rem;text-align:left;min-height:58px;display:flex;flex-direction:column;justify-content:center}
.opt:hover:not(:disabled){border-color:var(--cyan);background:var(--panel2)}
.opt:disabled{cursor:default}
.opt.ok,.tk.ok,.chip.ok{border-color:var(--good);background:rgba(56,224,140,.18)}
.opt.no,.tk.no,.chip.no{border-color:var(--bad);background:rgba(255,107,122,.2)}
.tks{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tk{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:800;font-size:1.15rem;min-height:48px}
.tk.big{font-family:var(--fd);font-size:1.5rem;padding:14px 20px}
.tk.shp{padding:8px}
.tk:hover:not(:disabled){border-color:var(--cyan)}
.tk.sel{border-color:var(--gold);background:rgba(255,208,74,.18)}
.tk.miss{border-color:var(--gold);border-style:dashed}
.sep{color:var(--muted);font-family:var(--fd);font-size:1.4rem}
.q2{font-weight:800;margin:16px 0 10px}
.hint{color:var(--gold);font-weight:700;margin-top:8px}
.pool,.bk-body{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:52px}
.pool{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:12px}
.chip{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;cursor:grab}
.chip.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,208,74,.3)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.bk{border:2px dashed var(--violet);border-radius:18px;padding:12px;background:rgba(31,163,92,.07);cursor:pointer;min-height:130px}
.bk.over{background:rgba(31,163,92,.25)}
.bk h4{margin:0 0 8px;font-family:var(--fd);font-size:.85rem}
.bk h4 small{display:block;font-family:var(--fb);color:var(--muted);font-weight:600;font-size:.78rem;margin-top:2px}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.fb{border-radius:18px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.fbh{font-family:var(--fd);font-weight:700}
.fbh.g{color:var(--good)} .fbh.b{color:var(--gold)}
.fbt{font-size:1rem}
.fbt .fr{font-size:1rem}
.sl{fill:rgba(255,255,255,.07);stroke:#fff;stroke-width:2}
.sl.on{fill:var(--c,var(--pink))}
.click .sl{cursor:pointer}
.click .sl:hover{fill:rgba(255,255,255,.22)}
.click .sl.on:hover{fill:var(--c,var(--pink))}
.dot.on{fill:var(--cyan)}
.piegrp{display:flex;gap:10px;flex-wrap:wrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-weight:800;margin:0 .18em}
.fr i{font-style:normal;padding:0 .35em}
.fr i:first-child{border-bottom:2px solid currentColor}
.sh{fill:rgba(255,255,255,.1);stroke:#fff;stroke-width:2.5}
.ln{stroke:var(--pink);stroke-width:3.5;stroke-linecap:round}
.cnt-tot{font-family:var(--fd);font-size:1.6rem;color:var(--gold)}
.heap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.tray{min-height:104px;border:2px dashed var(--cyan);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:rgba(61,220,132,.06)}
.tray.over{background:rgba(61,220,132,.2)}
.tray .coin{cursor:pointer}
.trayhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;gap:10px;flex-wrap:wrap}
.pal{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.coin{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px}
.coin:hover{border-color:var(--cyan)}
.coin small{font-size:.72rem;color:var(--muted);font-weight:700}
.tray .coin{background:transparent;border-color:transparent;padding:2px}
.price{display:inline-flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid var(--gold);border-radius:14px;padding:8px 16px;font-family:var(--fd);font-weight:700;color:var(--gold);font-size:1.25rem}
.price span{font-family:var(--fb);color:var(--ink);font-size:1rem;font-weight:800}

/* lição */
.lesson{max-width:780px;display:flex;flex-direction:column;gap:16px}
.lesson .card p{margin:0 0 .6em}
.lesson ul{margin:.3em 0 .6em;padding-left:1.2em}
.lesson li{margin:.25em 0}
.lesson b{color:var(--gold)}
.tripl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.tripl div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:.9rem}
.tripl big{display:block;font-family:var(--fd);font-size:1.25rem;margin:4px 0}
.coinrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0}
.coinrow div{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.85rem;text-align:center}
.coinrow small{color:var(--muted);font-weight:600}

/* resumo */
.sum{max-width:780px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.big{font-family:var(--fd);font-size:2.2rem;font-weight:800}
.rep{width:100%;min-height:190px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;font:600 .9rem/1.5 ui-monospace,Consolas,monospace}

/* cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pc{aspect-ratio:3/4;border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 60%,#07140d),#0d2216 75%);border:2px solid var(--c)}
.pc b{font-family:var(--fd);font-size:.9rem}
.pc small{font-size:.74rem;color:#e8e0ff;line-height:1.2}
.pc.lock{filter:grayscale(1) brightness(.6);border-style:dashed}
.pc .pcav{display:grid;place-items:center;min-height:90px;font-family:var(--fd);font-size:2rem}
.pc.holo{border-color:transparent;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 60%,#07140d),#0d2216 75%) padding-box,linear-gradient(135deg,var(--pink),var(--cyan),var(--gold),var(--pink)) border-box;border:3px solid transparent}

table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.tw{overflow-x:auto}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:800}

/* dance */
.dance{position:fixed;inset:0;z-index:60;background:radial-gradient(800px 500px at 50% 0,rgba(255,198,26,.45),transparent 60%),#07140d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.dance h2{font-size:clamp(1.4rem,4vw,2.2rem)}
.dcr{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.dcr .av{animation:bop .5s ease-in-out infinite alternate}
.dcr .av:nth-child(2){animation-delay:.1s}.dcr .av:nth-child(3){animation-delay:.2s}.dcr .av:nth-child(4){animation-delay:.3s}.dcr .av:nth-child(5){animation-delay:.4s}
@keyframes bop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-26px) rotate(6deg)}}
.eq{display:flex;gap:6px;align-items:flex-end;height:60px}
.eq i{width:10px;border-radius:4px;background:linear-gradient(var(--cyan),var(--pink));animation:eq .6s ease-in-out infinite alternate}
@keyframes eq{from{height:8px}to{height:58px}}
.eq i:nth-child(2n){animation-duration:.45s}.eq i:nth-child(3n){animation-duration:.8s}.eq i:nth-child(5n){animation-delay:.2s}
.dtime{font-family:var(--fd);font-size:2.4rem;color:var(--gold)}
@media (prefers-reduced-motion:reduce){.dcr .av,.eq i,.mc{animation:none;transition:none}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .top{display:flex;align-items:center;gap:12px;padding:14px 0 4px}
  .top button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800}
  .side{position:fixed;left:0;top:0;bottom:0;max-height:none;width:min(88vw,340px);background:var(--bg2);z-index:40;padding:20px 16px 20px max(16px,env(safe-area-inset-left,0px));transform:translateX(-108%);transition:transform .25s;border-right:1px solid var(--line)}
  .side.open{transform:none}
  .main{padding-top:14px}
  body{font-size:17px}
}

/* iPad / toque */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chip,.coin,.tk,.opt,.btn,.ghost,.bk,.mc,.day{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip,.pal .coin{touch-action:none}
.chip{min-height:46px;display:inline-flex;align-items:center}
.tdrag{position:fixed;z-index:200;pointer-events:none;opacity:.92;transform:translate(-50%,-60%) scale(1.08);box-shadow:0 10px 28px rgba(0,0,0,.5)}
.bk.over,.tray.over,.pool.over{outline:3px solid var(--cyan);outline-offset:2px}
@media (pointer:coarse){.opt{min-height:66px}.tk{min-height:56px}.btn{min-height:52px}.ghost{min-height:44px}.chip{min-height:50px;font-size:1.08rem}.pal .coin{padding:8px}}
@media (min-width:700px) and (max-width:1200px){html{font-size:17px}.side{max-height:100dvh}}
@supports (height:100dvh){.side{max-height:100dvh}}

body{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 90px,transparent 90px 180px),radial-gradient(900px 520px at 88% -8%,rgba(255,198,26,.16),transparent 60%),radial-gradient(760px 520px at -8% 18%,rgba(61,220,132,.14),transparent 60%)}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ni{width:min(230px,62vw);font:800 1.7rem var(--fb);padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.ni.ok{border-color:var(--good)}.ni.no{border-color:var(--bad)}
.nu{font-weight:800;font-size:1.2rem;color:var(--muted)}
.nhint{font-size:.9rem;color:var(--muted);margin:4px 0 8px}
.ordhint{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin:6px 0}
.ordslots{display:flex;flex-direction:column;gap:8px;margin:8px 0 14px}
.oslot{display:flex;align-items:center;gap:10px;min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:6px 10px}
.oslot.fill{border-style:solid;background:var(--panel)}
.oslot i{font-style:normal;font-family:var(--fd);min-width:28px;height:28px;border-radius:99px;background:var(--panel2);display:grid;place-items:center;font-size:.8rem}
.gsvg{max-width:100%;height:auto}
.gl{stroke:rgba(255,255,255,.2);stroke-width:1}
.gt{fill:var(--muted);font:700 11px var(--fb)}
.gp{fill:rgba(255,255,255,.001);cursor:pointer}
.gp:hover{fill:rgba(255,198,26,.35)}
.vis svg{max-width:100%;height:auto}

.src{max-width:780px;margin:12px 0;padding:14px 18px;border:2px solid var(--gold);border-radius:16px;background:rgba(255,183,3,.09);font-size:1.08rem;line-height:1.65}
.src h5{margin:0 0 8px;font:800 .78rem var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.src p{margin:0 0 .6em}.src p:last-child{margin-bottom:0}
.src mark{background:#ffe45c;color:#1b1600;border-radius:4px;padding:0 3px}
details.src summary{cursor:pointer;font-weight:800;color:var(--gold)}
details.src[open] summary{margin-bottom:10px}
details.src h5{margin-top:10px}
.lbl{font:800 .8rem var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin:10px 0 -4px}
.gate{max-width:780px;margin:10px 0 6px;display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-size:.95rem}
.gate .gb{flex:1;min-width:90px;height:9px;border-radius:99px;background:var(--panel2);overflow:hidden}
.gate .gb i{display:block;height:100%;width:0;background:var(--cyan);transition-property:width;transition-timing-function:linear}
.area.lock{opacity:.3;pointer-events:none;filter:grayscale(.5)}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>

<div class="top"><button id="menu" aria-label="Abrir menu de dias">Menu</button><span class="wm">COPA 5</span></div>
<div class="app">
  <aside class="side" id="side" aria-label="Menu de provas">

const CAPM={id:'c1',guide:'rafa',mins:8,title:B('Capacity: mL and L','Capacidade: mL e L'),lesson:B('<div class="card"><p><b>Capacity</b> is how much liquid a container can hold. We use <b>millilitres (mL)</b> and <b>litres (L)</b>.</p><div class="tripl"><div>1 L<big>1000 mL</big>one litre</div><div>½ L<big>500 mL</big>half litre</div><div>¼ L<big>250 mL</big>quarter</div></div><p>L → mL: <b>× 1000</b>. mL → L: <b>÷ 1000</b>.</p><p class="mono">3.4 L = 3400 mL\n0.65 L = 650 mL\n5.25 L = 5250 mL\n750 mL = 0.75 L</p></div>','<div class="card"><p><b>Capacidade</b> é quanto líquido cabe em um recipiente. Usamos <b>mililitros (mL)</b> e <b>litros (L)</b>.</p><div class="tripl"><div>1 L<big>1000 mL</big>um litro</div><div>½ L<big>500 mL</big>meio litro</div><div>¼ L<big>250 mL</big>um quarto</div></div><p>L → mL: <b>× 1000</b>. mL → L: <b>÷ 1000</b>.</p><p class="mono">3,4 L = 3400 mL\n0,65 L = 650 mL\n5,25 L = 5250 mL\n750 mL = 0,75 L</p></div>'),build:()=>[gCapUnit(),gCapUnit(),gLmL(),gLmL(),gLmL(),gmLL(),gmLL(),gmLL(),gCapMix(),gCapCmp(),gOrderCap()]};

const MU=[['a grain of rice','um grão de arroz','mg'],['an apple','uma maçã','g'],['a ten-year-old student','um aluno de 10 anos','kg'],['a school bus','um ônibus escolar','t'],['a paper clip','um clipe de papel','g'],['a bag of potatoes','um saco de batatas','kg'],['an elephant','um elefante','t'],['a feather','uma pena','mg']];
function gMassUnit(){const x=pick(MU);return choiceEx({label:'Unidade de massa',q:B('Which unit is best to measure the mass of <b>'+x[0]+'</b>?','Qual unidade é melhor para medir a massa de <b>'+x[1]+'</b>?'),opts:[opt(x[2],1)].concat(['mg','g','kg','t'].filter(u=>u!==x[2]).map(u=>opt(u))),ex:B('mg for tiny things, g for light things, kg for people and bags, t for very heavy things. Here: '+x[2]+'.','mg para coisas minúsculas, g para coisas leves, kg para pessoas e sacos, t para coisas muito pesadas. Aqui: '+x[2]+'.')})}
const MCV=[['kg','g',1000,'×'],['g','mg',1000,'×'],['t','kg',1000,'×'],['g','kg',1000,'÷'],['mg','g',1000,'÷'],['kg','t',1000,'÷']];
function gMassConv(){const c=pick(MCV);let v;if(c[3]==='×')v=pick([2,3,5,7,12,0.5,2.5,1.2,4.8,0.75,3.4]);else v=pick([4200,3500,750,8000,600,2700,1500,9000,250]);
 const ans=c[3]==='×'?+(v*1000).toFixed(6):+(v/1000).toFixed(6);const num=Math.random()<.55;
 const q=B('Convert <b>'+dec(v,'en')+' '+c[0]+'</b> to '+c[1]+'.','Converta <b>'+dec(v,'pt')+' '+c[0]+'</b> para '+c[1]+'.');
 const ex=bb(l=>'1 '+(c[3]==='×'?c[0]+' = 1000 '+c[1]:c[1]+' = 1000 '+c[0])+(l==='pt'?'. Então '+(c[3]==='×'?'multiplicamos':'dividimos')+' por 1000: ':'. So '+(c[3]==='×'?'multiply':'divide')+' by 1000: ')+dec(v,l)+' '+c[3]+' 1000 = '+dec(ans,l)+' '+c[1]+'.');
 if(num)return {type:'num',label:dec(v,'pt')+' '+c[0]+' para '+c[1],q,ans,unit:c[1],ex};
 return choiceEx({label:dec(v,'pt')+' '+c[0]+' para '+c[1],q,opts:mk(ans,[ans*10,ans/10,ans*100,ans/100,ans*1000],x=>dq(x,c[1])),ex})}
const MOV=[[4200,'mg'],[5,'kg'],[8,'g'],[3500,'g'],[600,'kg'],[3,'t'],[7000,'kg'],[2.7,'kg'],[1200,'g'],[900,'mg'],[0.5,'kg'],[2,'t'],[350,'g'],[6.5,'kg']];
const toMg=(v,u)=>v*({mg:1,g:1e3,kg:1e6,t:1e9}[u]);
function gMassOrder(n){const set=[];const pool=shuffle(MOV.slice());for(const p of pool){if(set.every(q=>toMg(q[0],q[1])!==toMg(p[0],p[1])))set.push(p);if(set.length>=(n||4))break}
 const dsc=Math.random()<.5;const items=set.map(p=>({v:toMg(p[0],p[1]),t:bb(l=>dec(p[0],l)+' '+p[1])}));
 return {type:'order',label:'Ordenar massas',q:B('Tap the masses in <b>'+(dsc?'decreasing':'increasing')+'</b> order. Hint: convert everything to the same unit (grams).','Toque nas massas em ordem <b>'+(dsc?'decrescente':'crescente')+'</b>. Dica: passe tudo para a mesma unidade (gramas).'),items,desc:dsc,ex:bb(l=>(l==='pt'?'Em gramas: ':'In grams: ')+set.slice().sort((a,b)=>dsc?toMg(b[0],b[1])-toMg(a[0],a[1]):toMg(a[0],a[1])-toMg(b[0],b[1])).map(p=>dec(p[0],l)+' '+p[1]+' = '+dec(toMg(p[0],p[1])/1000,l)+' g').join('; ')+'.')}}
const MASSM={id:'c2',guide:'nico',mins:8,title:B('Mass: mg, g, kg, t','Massa: mg, g, kg, t'),lesson:B('<div class="card"><p><b>Mass</b> tells how heavy something is. Units, from smallest to biggest:</p><div class="tripl"><div>mg<big>feather</big>milligram</div><div>g<big>apple</big>gram</div><div>kg<big>student</big>kilogram</div><div>t<big>bus</big>tonne</div></div><p class="mono">1000 mg = 1 g\n1000 g = 1 kg\n1000 kg = 1 t</p><p>Each step is <b>× 1000</b> (going down) or <b>÷ 1000</b> (going up). To compare masses, change all of them to the <b>same unit</b>.</p></div>','<div class="card"><p><b>Massa</b> diz o quanto algo pesa. Unidades, da menor para a maior:</p><div class="tripl"><div>mg<big>pena</big>miligrama</div><div>g<big>maçã</big>grama</div><div>kg<big>aluno</big>quilograma</div><div>t<big>ônibus</big>tonelada</div></div><p class="mono">1000 mg = 1 g\n1000 g = 1 kg\n1000 kg = 1 t</p><p>Cada degrau é <b>× 1000</b> (descendo) ou <b>÷ 1000</b> (subindo). Para comparar massas, passe todas para a <b>mesma unidade</b>.</p></div>'),build:()=>[gMassUnit(),gMassUnit(),gMassConv(),gMassConv(),gMassConv(),gMassConv(),gMassConv(),gMassOrder(),gMassOrder(),gMassOrder(5)]};

/* ---- Volume (cubos isométricos) ---- */
function isoSvg(H){const n=H.length,m=H[0].length;const cw=22,ch=12.5,cz=25;let maxh=0;H.forEach(r=>r.forEach(h=>maxh=Math.max(maxh,h)));
 const W=(n+m)*cw+20,Ht=(n+m)*ch+maxh*cz+20;const ox=m*cw+10,oy=maxh*cz+10;let out='';
 const P=(x,y,z)=>[ox+(x-y)*cw,oy+(x+y)*ch-z*cz];
 const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 for(let s=0;s<=n+m-2;s++)for(let x=0;x<n;x++){const y=s-x;if(y<0||y>=m)continue;for(let z=0;z<H[x][y];z++){
  out+='<polygon points="'+pts([P(x,y,z+1),P(x+1,y,z+1),P(x+1,y+1,z+1),P(x,y+1,z+1)])+'" fill="#7be08a" stroke="#0d3b1e" stroke-width="1"/>'
   +'<polygon points="'+pts([P(x,y+1,z+1),P(x+1,y+1,z+1),P(x+1,y+1,z),P(x,y+1,z)])+'" fill="#2fae52" stroke="#0d3b1e" stroke-width="1"/>'
   +'<polygon points="'+pts([P(x+1,y,z+1),P(x+1,y+1,z+1),P(x+1,y+1,z),P(x+1,y,z)])+'" fill="#1d7f3b" stroke="#0d3b1e" stroke-width="1"/>'}}
 return '<svg viewBox="0 0 '+W.toFixed(0)+' '+Ht.toFixed(0)+'" width="'+Math.min(360,W*1.3).toFixed(0)+'" role="img" aria-label="sólido feito de cubos">'+out+'</svg>'}
function solid(){const t=rnd(0,2);let H;
 if(t===0){const a=rnd(2,4),b=rnd(2,4),h=rnd(2,3);H=Array.from({length:a},()=>Array(b).fill(h))}
 else if(t===1){const a=rnd(3,4),b=rnd(2,3),hh=rnd(2,3);H=Array.from({length:a},(_,i)=>Array.from({length:b},(_,j)=>i<2?hh:1))}
 else{const a=3,b=3;H=Array.from({length:a},(_,i)=>Array.from({length:b},(_,j)=>(i===0||j===0)?rnd(2,3):1))}
 return H}
const vsum=H=>H.reduce((a,r)=>a+r.reduce((x,y)=>x+y,0),0);
function gVolCubes(){const H=solid();const v=vsum(H);const num=Math.random()<.5;
 const o={label:'Volume contando cubos',q:B('Each small cube has a volume of <b>1 cm³</b>. What is the volume of this solid?','Cada cubinho tem volume de <b>1 cm³</b>. Qual é o volume deste sólido?'),visFn:()=>isoSvg(H),ex:B('Count the cubes layer by layer. Total: '+v+' cubes, so the volume is <b>'+v+' cm³</b>.','Conte os cubos camada por camada. Total: '+v+' cubos, então o volume é <b>'+v+' cm³</b>.')};
 return num?Object.assign({type:'num',ans:v,unit:'cm³'},o):choiceEx(Object.assign(o,{opts:mk(v,[v+3,v-2,v+6,v-4,v*2],x=>x+' cm³')}))}
function gVolPrism(){const a=rnd(2,6),b=rnd(2,5),c=rnd(2,5);const v=a*b*c;
 return Math.random()<.5?{type:'num',label:'Volume do prisma '+a+'×'+b+'×'+c,q:B('A box is <b>'+a+' cm</b> long, <b>'+b+' cm</b> wide and <b>'+c+' cm</b> tall. What is its volume?','Uma caixa tem <b>'+a+' cm</b> de comprimento, <b>'+b+' cm</b> de largura e <b>'+c+' cm</b> de altura. Qual é o volume?'),ans:v,unit:'cm³',ex:B('V = length × width × height = '+a+' × '+b+' × '+c+' = <b>'+v+' cm³</b>.','V = comprimento × largura × altura = '+a+' × '+b+' × '+c+' = <b>'+v+' cm³</b>.')}
 :choiceEx({label:'Volume do prisma '+a+'×'+b+'×'+c,q:B('A rectangular prism has <b>'+a+'</b> cubes in each row, <b>'+b+'</b> rows and <b>'+c+'</b> layers. How many cubes (volume in cm³)?','Um prisma tem <b>'+a+'</b> cubos em cada fileira, <b>'+b+'</b> fileiras e <b>'+c+'</b> camadas. Quantos cubos (volume em cm³)?'),opts:mk(v,[a+b+c,a*b,v+a,v-b,v*2],x=>x+' cm³'),ex:B(a+' × '+b+' × '+c+' = '+v+' cm³.',a+' × '+b+' × '+c+' = '+v+' cm³.')})}
function gVolLayer(){const a=rnd(2,5),b=rnd(2,4),c=rnd(2,4);return {type:'num',label:'Camadas '+a+'×'+b+' e '+c+' andares',q:B('The bottom layer has <b>'+a*b+'</b> cubes. There are <b>'+c+'</b> identical layers. How many cubes in all?','A camada de baixo tem <b>'+a*b+'</b> cubos. Há <b>'+c+'</b> camadas iguais. Quantos cubos no total?'),ans:a*b*c,unit:'',ex:B(a*b+' × '+c+' = '+a*b*c+' cubes.',a*b+' × '+c+' = '+a*b*c+' cubos.')}}
const VOLM={id:'c3',guide:'leo',mins:9,title:B('Volume with cubes','Volume com cubos'),lesson:B('<div class="card"><p><b>Volume</b> is how much space a solid takes up. We count <b>unit cubes</b>. One cube with 1 cm edges has a volume of <b>1 cm³</b> (1 cubic centimetre).</p><div class="vis">'+isoSvg([[2,2,2],[2,2,2]])+'</div><p>This solid: 3 cubes long × 2 wide × 2 tall = <b>12 cm³</b>.</p><p><b>Rectangular prism:</b> V = length × width × height. Or: cubes in one layer × number of layers.</p></div><div class="card"><p>For an L-shaped solid, count each layer (or each column) and <b>add</b> them.</p></div>','<div class="card"><p><b>Volume</b> é o espaço que um sólido ocupa. Contamos <b>cubinhos</b>. Um cubo de 1 cm de aresta tem volume de <b>1 cm³</b> (1 centímetro cúbico).</p><div class="vis">'+isoSvg([[2,2,2],[2,2,2]])+'</div><p>Este sólido: 3 cubos de comprimento × 2 de largura × 2 de altura = <b>12 cm³</b>.</p><p><b>Prisma retangular:</b> V = comprimento × largura × altura. Ou: cubos de uma camada × número de camadas.</p></div><div class="card"><p>Num sólido em forma de L, conte cada camada (ou cada coluna) e <b>some</b>.</p></div>'),build:()=>[gVolCubes(),gVolCubes(),gVolCubes(),gVolCubes(),gVolPrism(),gVolPrism(),gVolLayer(),gVolPrism(),gVolCubes()]};

/* ---- Frações equivalentes ---- */
const EQF=[[1,2],[2,3],[3,4],[1,3],[2,5],[3,5],[4,5],[5,8],[7,9],[4,6],[3,8],[5,6],[1,4]];
const SHEETEQ=[[4,6,'n',18],[5,8,'d',10],[3,4,'n',24],[7,9,'n',18]];
function gEqNum(){const f=pick(EQF),k=rnd(2,6);const A=f[0]*k,Bn=f[1]*k;const unknownN=Math.random()<.5;
 return {type:'num',label:fr(f[0],f[1])+' = ?',q:bb(l=>'Find the missing number: '.replace('Find the missing number: ',l==='pt'?'Ache o número que falta: ':'Find the missing number: ')+'<b>'+fr(f[0],f[1])+' = '+(unknownN?fr('?',Bn):fr(A,'?'))+'</b>'),ans:unknownN?A:Bn,unit:'',ex:bb(l=>(l==='pt'?'Multiplicamos em cima e embaixo pelo mesmo número ('+k+'): ':'Multiply top and bottom by the same number ('+k+'): ')+fr(f[0],f[1])+' = '+fr(A,Bn)+'.')}}
function gEqSheet(){const s=pick(SHEETEQ);const k=s[3]/(s[2]==='n'?s[1]:s[0]);const A=s[0]*(s[2]==='n'?s[3]/s[1]:k),Bn=s[1]*(s[2]==='n'?s[3]/s[1]:k);
 const kk=s[2]==='n'?s[3]/s[1]:s[3]/s[0];const N=s[0]*kk,D=s[1]*kk;
 return {type:'num',label:fr(s[0],s[1])+' = ?',q:bb(l=>(l==='pt'?'Ache o número que falta: ':'Find the missing number: ')+'<b>'+fr(s[0],s[1])+' = '+(s[2]==='n'?fr('?',D):fr(N,'?'))+'</b>'),ans:s[2]==='n'?N:D,unit:'',ex:bb(l=>(l==='pt'?'Multiplicamos ou dividimos em cima e embaixo pelo mesmo número ('+kk+'): ':'Multiply top and bottom by the same number ('+kk+'): ')+fr(s[0],s[1])+' = '+fr(N,D)+'.')}}
function gEqPick(){const f=pick(EQF),k=rnd(2,5);const right=[f[0]*k,f[1]*k];const wr=[[f[0]*k,f[1]*k+1],[f[0]+k,f[1]+k],[f[0]*k+1,f[1]*k]];
 return choiceEx({label:'Fração equivalente a '+f[0]+'/'+f[1],q:B('Which fraction is <b>equivalent</b> to '+fr(f[0],f[1])+'?','Qual fração é <b>equivalente</b> a '+fr(f[0],f[1])+'?'),opts:[opt(fr(right[0],right[1]),1)].concat(uniq(wr.map(w=>fr(w[0],w[1])).concat([fr(right[0]+1,right[1]+2),fr(right[0]*2+1,right[1]*2)]).filter(x=>x!==fr(right[0],right[1]))).slice(0,3).map(x=>opt(x))),ex:B('Equivalent fractions name the same amount. Multiply top and bottom by '+k+': '+fr(f[0],f[1])+' = '+fr(right[0],right[1])+'. Adding the same number to the top and bottom does not work.','Frações equivalentes representam a mesma quantidade. Multiplique em cima e embaixo por '+k+': '+fr(f[0],f[1])+' = '+fr(right[0],right[1])+'. Somar o mesmo número em cima e embaixo não funciona.')})}
function gEqSimplify(){const f=pick(EQF),k=rnd(2,6);return choiceEx({label:'Simplificar '+f[0]*k+'/'+f[1]*k,q:B('Simplify '+fr(f[0]*k,f[1]*k)+' (write it in simplest form).','Simplifique '+fr(f[0]*k,f[1]*k)+' (escreva na forma mais simples).'),opts:[opt(fr(f[0],f[1]),1),opt(fr(f[1],f[0])),opt(fr(f[0]+1,f[1]+1)),opt(fr(f[0]*k,f[1]))],ex:B('Divide top and bottom by '+k+': '+fr(f[0]*k,f[1]*k)+' = '+fr(f[0],f[1])+'.','Divida em cima e embaixo por '+k+': '+fr(f[0]*k,f[1]*k)+' = '+fr(f[0],f[1])+'.')})}
const EQM={id:'c4',guide:'bruno',mins:7,title:B('Equivalent fractions','Frações equivalentes'),lesson:B('<div class="card"><p><b>Equivalent fractions</b> name the same amount in different ways.</p><p class="mono">1/2 = 2/4 = 3/6 = 4/8</p><p>To make one: <b>multiply</b> (or divide) the numerator and the denominator by the <b>same</b> number.</p><p>'+fr(2,3)+' = '+fr('2 × 4','3 × 4')+' = '+fr(8,12)+'</p></div>','<div class="card"><p><b>Frações equivalentes</b> representam a mesma quantidade de jeitos diferentes.</p><p class="mono">1/2 = 2/4 = 3/6 = 4/8</p><p>Para formar uma: <b>multiplique</b> (ou divida) o numerador e o denominador pelo <b>mesmo</b> número.</p><p>'+fr(2,3)+' = '+fr('2 × 4','3 × 4')+' = '+fr(8,12)+'</p></div>'),build:()=>[gEqSheet(),gEqSheet(),gEqNum(),gEqNum(),gEqNum(),gEqPick(),gEqPick(),gEqSimplify(),gEqSimplify()]};

/* ---- Frações impróprias, mistas, comparar e ordenar ---- */
function gImpMix(){const d=rnd(2,8),w=rnd(1,5),r=rnd(1,d-1);const n=w*d+r;const toMix=Math.random()<.5;
 const o={label:toMix?n+'/'+d+' em número misto':w+' '+r+'/'+d+' em fração imprópria',ex:B('Mixed number = whole + part. '+n+' ÷ '+d+' = '+w+' remainder '+r+', so '+fr(n,d)+' = '+mixed(w,r,d)+'.','Número misto = inteiro + parte. '+n+' ÷ '+d+' = '+w+' resto '+r+', então '+fr(n,d)+' = '+mixed(w,r,d)+'.')};
 if(toMix)return choiceEx(Object.assign(o,{q:B('Write <b>'+fr(n,d)+'</b> as a mixed number.','Escreva <b>'+fr(n,d)+'</b> como número misto.'),opts:[opt(mixed(w,r,d),1)].concat(uniq([mixed(w+1,r,d),mixed(w,d-r,d),mixed(r,w,d),mixed(w,r+1,d),mixed(w-1,r,d),mixed(w+2,r,d)].filter(x=>x!==mixed(w,r,d))).slice(0,3).map(x=>opt(x)))}));
 return choiceEx(Object.assign(o,{q:B('Write <b>'+mixed(w,r,d)+'</b> as an improper fraction.','Escreva <b>'+mixed(w,r,d)+'</b> como fração imprópria.'),opts:[opt(fr(n,d),1)].concat(uniq([fr(w+r,d),fr(w*r,d),fr(n+d,d),fr(n-d,d),fr(n+1,d),fr(w*d,d)].filter(x=>x!==fr(n,d))).slice(0,3).map(x=>opt(x))),ex:B(w+' × '+d+' + '+r+' = '+n+', so '+mixed(w,r,d)+' = '+fr(n,d)+'.',w+' × '+d+' + '+r+' = '+n+', então '+mixed(w,r,d)+' = '+fr(n,d)+'.')}))}
function gImpNum(){const d=rnd(3,9),w=rnd(2,6),r=rnd(1,d-1);const n=w*d+r;return {type:'num',label:w+' '+r+'/'+d+' em fração imprópria (numerador)',q:B('Write <b>'+mixed(w,r,d)+'</b> as an improper fraction with denominator '+d+'. What is the <b>numerator</b>?','Escreva <b>'+mixed(w,r,d)+'</b> como fração imprópria de denominador '+d+'. Qual é o <b>numerador</b>?'),ans:n,unit:'',ex:B(w+' × '+d+' = '+w*d+', plus '+r+' = '+n+'. So '+fr(n,d)+'.',w+' × '+d+' = '+w*d+', mais '+r+' = '+n+'. Então '+fr(n,d)+'.')}}
function gFrClass(){const items=[];const pool=[[3,5,'p'],[7,4,'i'],[1,8,'p'],[9,2,'i'],[5,5,'i'],[2,9,'p'],[11,6,'i'],[4,7,'p']];
 sample(pool,4).forEach(p=>items.push([fr(p[0],p[1]),p[2]]));const mx=[[1,1,2],[2,3,4],[3,2,5],[4,1,3]];sample(mx,2).forEach(m=>items.push([mixed(m[0],m[1],m[2]),'m']));
 return SO('Própria, imprópria ou mista?','Sort each number: <b>proper fraction</b>, <b>improper fraction</b> or <b>mixed number</b>.','Arraste cada número: <b>fração própria</b>, <b>fração imprópria</b> ou <b>número misto</b>.',[['p','Proper','numerator < denominator'],['i','Improper','numerator ≥ denominator'],['m','Mixed','whole + fraction']],items,t=>{const k=t.b;return t.t+' is a '+(k==='p'?'proper fraction (the numerator is smaller than the denominator).':k==='i'?'improper fraction (the numerator is bigger than or equal to the denominator).':'mixed number (a whole number plus a fraction).')},'Proper: the top is smaller. Improper: the top is bigger or equal. Mixed: whole number + fraction.','Própria: o de cima é menor. Imprópria: o de cima é maior ou igual. Mista: inteiro + fração.')}
function gFrCmp(){const d=rnd(4,12),a=rnd(1,d-1);let b=rnd(1,d-1);if(b===a)b=a%(d-1)+1;const bigA=a>b;
 return choiceEx({label:'Comparar '+a+'/'+d+' e '+b+'/'+d,q:B('Which is greater: '+fr(a,d)+' or '+fr(b,d)+'?','Qual é maior: '+fr(a,d)+' ou '+fr(b,d)+'?'),opts:[opt(fr(bigA?a:b,d),1),opt(fr(bigA?b:a,d)),opt(B('They are equal','São iguais')),opt(B('Cannot tell','Não dá para saber'))],fixed:true,ex:B('Same denominator ('+d+'): the bigger numerator is the bigger fraction. '+Math.max(a,b)+' > '+Math.min(a,b)+'.','Mesmo denominador ('+d+'): quanto maior o numerador, maior a fração. '+Math.max(a,b)+' > '+Math.min(a,b)+'.')})}
function gFrCmpDiff(){const f=pick([[1,2],[2,3],[3,4],[3,5],[2,5],[5,8],[1,3],[3,8]]);const g=pick([[1,2],[2,3],[3,4],[3,5],[2,5],[5,8],[1,3],[3,8]]);if(f[0]*g[1]===g[0]*f[1])return gFrCmp();

function gProb(){const k=rnd(0,6);
 if(k===0){const L=pick([1.5,2,2.5,1.2]),m=pick([250,350,400,450]);const a=L*1000-m;return {type:'num',label:'Problema: garrafa',q:B('A bottle holds <b>'+dec(L,'en')+' L</b> of water. Rafa drinks <b>'+m+' mL</b>. How many mL are left?','Uma garrafa tem <b>'+dec(L,'pt')+' L</b> de água. Rafa bebe <b>'+m+' mL</b>. Quantos mL sobram?'),ans:a,unit:'mL',ex:B(dec(L,'en')+' L = '+L*1000+' mL. '+L*1000+' − '+m+' = '+a+' mL.',dec(L,'pt')+' L = '+L*1000+' mL. '+L*1000+' − '+m+' = '+a+' mL.')}}
 if(k===1){const kg=pick([5,3,2,4]),g=pick([250,500,750,300]);return {type:'num',label:'Problema: saco de arroz',q:B('A bag has <b>'+kg+' kg</b> of rice. The cook uses <b>'+g+' g</b>. How many grams are left?','Um saco tem <b>'+kg+' kg</b> de arroz. A cozinheira usa <b>'+g+' g</b>. Quantos gramas sobram?'),ans:kg*1000-g,unit:'g',ex:B(kg+' kg = '+kg*1000+' g. '+kg*1000+' − '+g+' = '+(kg*1000-g)+' g.',kg+' kg = '+kg*1000+' g. '+kg*1000+' − '+g+' = '+(kg*1000-g)+' g.')}}
 if(k===2){const a=pick([1.2,0.85,2.05,1.5]),b=pick([850,600,1500,750]);const tot=a*1000+b;return {type:'num',label:'Problema: suco',q:B('A team drinks <b>'+dec(a,'en')+' L</b> of juice at lunch and <b>'+b+' mL</b> at dinner. How many mL in all?','O time bebe <b>'+dec(a,'pt')+' L</b> de suco no almoço e <b>'+b+' mL</b> no jantar. Quantos mL ao todo?'),ans:tot,unit:'mL',ex:B(dec(a,'en')+' L = '+a*1000+' mL. '+a*1000+' + '+b+' = '+tot+' mL.',dec(a,'pt')+' L = '+a*1000+' mL. '+a*1000+' + '+b+' = '+tot+' mL.')}}
 if(k===3){const c=pick([250,500,200]),n=rnd(3,8);const L=c*n/1000;return {type:'num',label:'Problema: copos',q:B('Each cup holds <b>'+c+' mL</b>. How many <b>litres</b> are needed to fill <b>'+n+'</b> cups?','Cada copo comporta <b>'+c+' mL</b>. Quantos <b>litros</b> são necessários para encher <b>'+n+'</b> copos?'),ans:L,unit:'L',ex:bb(l=>c+' × '+n+' = '+c*n+' mL = '+dec(L,l)+' L.')}}
 if(k===4){const a=rnd(2,5),b=rnd(2,4),c=rnd(2,4),n=rnd(2,5);return {type:'num',label:'Problema: caixas',q:B('A box is <b>'+a+' cm × '+b+' cm × '+c+' cm</b>. What is the total volume of <b>'+n+'</b> of these boxes?','Uma caixa mede <b>'+a+' cm × '+b+' cm × '+c+' cm</b>. Qual é o volume total de <b>'+n+'</b> dessas caixas?'),ans:a*b*c*n,unit:'cm³',ex:B(a+' × '+b+' × '+c+' = '+a*b*c+' cm³ per box. × '+n+' = '+a*b*c*n+' cm³.',a+' × '+b+' × '+c+' = '+a*b*c+' cm³ por caixa. × '+n+' = '+a*b*c*n+' cm³.')}}
 if(k===5){const d=pick([4,5,8]),n=rnd(1,d-2);return {type:'num',label:'Problema: pizza',q:B('A pizza is cut in <b>'+d+'</b> equal slices. Leo eats <b>'+n+'</b>. How many slices are left?','Uma pizza é cortada em <b>'+d+'</b> fatias iguais. Léo come <b>'+n+'</b>. Quantas fatias sobram?'),ans:d-n,unit:'',ex:B(d+' − '+n+' = '+(d-n)+' slices left, that is '+fr(d-n,d)+' of the pizza.',d+' − '+n+' = '+(d-n)+' fatias, ou seja '+fr(d-n,d)+' da pizza.')}}
 const w=rnd(2,4),r=rnd(1,3),d=4;return {type:'num',label:'Problema: copos de suco',q:B('How many quarters ('+fr(1,4)+') are in <b>'+w+'</b> wholes?','Quantos quartos ('+fr(1,4)+') há em <b>'+w+'</b> inteiros?'),ans:w*4,unit:'',ex:B('Each whole has 4 quarters. '+w+' × 4 = '+w*4+'.','Cada inteiro tem 4 quartos. '+w+' × 4 = '+w*4+'.')}}
const PROBM={id:'c8',guide:'leo',mins:8,title:B('Word problems','Problemas do dia a dia'),lesson:B('<div class="card"><p>Steps: 1) read, 2) underline the numbers and the units, 3) <b>convert to the same unit</b>, 4) add, subtract, multiply or divide, 5) check.</p></div>','<div class="card"><p>Passos: 1) leia, 2) marque os números e as unidades, 3) <b>passe tudo para a mesma unidade</b>, 4) some, subtraia, multiplique ou divida, 5) confira.</p></div>'),build:()=>[gProb(),gProb(),gProb(),gProb(),gProb(),gProb(),gProb(),gProb()]};

function gJuice(){const v=sample([[1.2,'L'],[850,'mL'],[2.05,'L'],[1500,'mL'],[0.9,'L'],[1750,'mL'],[3,'L']],4);const items=v.map(p=>({v:p[1]==='L'?p[0]*1000:p[0],t:bb(l=>dec(p[0],l)+' '+p[1])}));const dsc=Math.random()<.5;
 return {type:'order',label:'Sucos em ordem',q:B('Four juices: '+v.map(p=>dec(p[0],'en')+' '+p[1]).join(', ')+'. Tap them in <b>'+(dsc?'decreasing':'increasing')+'</b> order.','Quatro sucos: '+v.map(p=>dec(p[0],'pt')+' '+p[1]).join(', ')+'. Toque em ordem <b>'+(dsc?'decrescente':'crescente')+'</b>.'),items,desc:dsc,ex:bb(l=>'Em mL: '.replace('Em mL: ',l==='pt'?'Em mL: ':'In mL: ')+items.map(i=>dec(i.v,l)).join(', ')+'.')}}

 Object.assign({},EQM,{id:'o5',lang:'pt',title:B('Equivalent','Equivalentes e números mistos'),build:()=>[gEqSheet(),gEqSheet(),gEqSheet(),gEqNum(),gEqNum(),gImpMix(),gImpMix(),gImpMix(),gImpNum(),gF2D()]}),
 Object.assign({},COORM,{id:'o6',lang:'pt',title:B('Coordinates','Plano e transformações')}),

const SQ1=[
 QE('What is a force','What is a <b>force</b>?','O que é uma <b>força</b>?',['A push or a pull','A kind of food','Only a very strong wind','A color of light'],'A force is a push or a pull. Forces can start, stop or change the movement of an object.','Força é um empurrão ou um puxão. Ela pode iniciar, parar ou mudar o movimento de um objeto.'),
 QE('Contact forces','What is a <b>contact force</b>?','O que é uma <b>força de contato</b>?',['A force that acts when objects touch','A force that works from far away','A force that only exists in space','A force that needs a magnet'],'Contact forces need the objects to touch. Example: pushing a toy car.','Forças de contato precisam que os objetos se toquem. Exemplo: empurrar um carrinho.'),
 QE('Non-contact forces','What is a <b>non-contact force</b>?','O que é uma <b>força de não contato</b>?',['A force that acts without touching','A force that needs a rope','A force made by friction','A force that stops all motion'],'Non-contact forces act at a distance. Examples: gravity and magnetism.','Forças de não contato agem à distância. Exemplos: gravidade e magnetismo.'),
 QE('Friction definition','Friction is a force that…','O atrito é uma força que…',['acts between touching surfaces and opposes movement','pulls objects toward Earth','attracts iron objects','makes objects float'],'Friction acts between surfaces that touch and slows down or stops moving objects.','O atrito age entre superfícies que se tocam e diminui ou para objetos em movimento.'),
 QE('Friction and surfaces','On which surface does a book slide <b>most easily</b>?','Em qual superfície um livro desliza <b>com mais facilidade</b>?',['Smooth ice','Thick carpet','Rough sandpaper','Grass'],'Smooth surfaces have less friction, so objects slide more easily.','Superfícies lisas têm menos atrito, então os objetos deslizam com mais facilidade.'),
 QE('Friction and heat','What happens when you rub your hands together fast?','O que acontece quando você esfrega as mãos rápido?',['Friction makes them warm','They get colder','Gravity pushes them','Nothing happens'],'Friction produces heat.','O atrito produz calor.'),
 QE('Reduce friction','How can we <b>reduce</b> friction between two parts of a machine?','Como podemos <b>reduzir</b> o atrito entre duas peças de uma máquina?',['Use oil or grease (a lubricant)','Make the surfaces rougher','Press the parts harder together','Add sandpaper'],'Lubricants like oil make surfaces slippery, so there is less friction.','Lubrificantes, como o óleo, deixam as superfícies escorregadias, e o atrito diminui.'),
 QE('Brakes','Why do bicycle brakes help the bike stop?','Por que os freios da bicicleta ajudam a parar?',['Friction between the brake pads and the wheel slows it down','Gravity pulls the wheel up','Magnetism holds the wheel','The wheel gets lighter'],'Brakes use friction, a contact force.','Os freios usam o atrito, uma força de contato.')];
const FSORT=[['A person kicks a soccer ball','c'],['A book slides more slowly on a carpet','c'],['Bicycle brakes help the bicycle stop','c'],['Pushing a toy car','c'],['A ball falls to the ground','n'],['A magnet attracts an iron nail','n'],['An apple falls from a tree','n'],['Two magnets push away from each other','n']];
function forceSort(){return SO('Contact or non-contact?','Is each force <b>contact</b> or <b>non-contact</b>?','Cada força é de <b>contato</b> ou de <b>não contato</b>?',[['c','Contact','objects touch'],['n','Non-contact','no touching needed']],sample(FSORT,6),t=>'<b>'+t.t+'</b>: '+(t.b==='c'?'the objects touch, so it is a contact force.':'it acts without touching, so it is a non-contact force (gravity or magnetism).'),'Contact: the objects touch (push, pull, friction). Non-contact: gravity and magnetism.','Contato: os objetos se tocam (empurrar, puxar, atrito). Não contato: gravidade e magnetismo.')}
const FWB=[['Gravity','pulls objects toward Earth'],['Friction','can slow down moving objects when surfaces rub together'],['Magnetism','can attract or repel objects without touching them']];
function forceFill(){const x=pick(FWB);return QE('Name the force','Which force <b>'+x[1]+'</b>?','Qual força <b>'+x[1].replace('pulls objects toward Earth','puxa os objetos em direção à Terra').replace('can slow down moving objects when surfaces rub together','pode diminuir objetos em movimento quando as superfícies se esfregam').replace('can attract or repel objects without touching them','pode atrair ou repelir objetos sem tocá-los')+'</b>?',[x[0]].concat(FWB.map(y=>y[0]).filter(y=>y!==x[0])).concat(['Static electricity']).slice(0,4),x[0]+' '+x[1]+'.',x[0]+': esta é a força descrita.')}
const SM1={id:'s1',guide:'duda',mins:8,title:B('Forces and friction','Forças e atrito'),lesson:B('<div class="card"><p>A <b>force</b> is a <b>push</b> or a <b>pull</b>.</p><div class="tripl"><div><b>Contact</b><br>objects touch<big>push, pull, friction</big></div><div><b>Non-contact</b><br>no touching<big>gravity, magnetism</big></div></div><p><b>Friction</b> acts between touching surfaces and opposes movement. Rough surfaces = more friction. Smooth surfaces = less friction. Friction makes heat. Oil reduces friction.</p></div>','<div class="card"><p>Uma <b>força</b> é um <b>empurrão</b> ou um <b>puxão</b>.</p><div class="tripl"><div><b>Contato</b><br>os objetos se tocam<big>empurrar, puxar, atrito</big></div><div><b>Não contato</b><br>sem tocar<big>gravidade, magnetismo</big></div></div><p>O <b>atrito</b> age entre superfícies que se tocam e se opõe ao movimento. Superfície áspera = mais atrito. Lisa = menos atrito. O atrito produz calor. O óleo reduz o atrito.</p></div>'),build:()=>SQ1.concat([forceSort(),forceSort(),forceFill(),forceFill()])};
const SQ2=[
 QE('Gravity','What does <b>gravity</b> do?','O que a <b>gravidade</b> faz?',['Pulls objects toward the center of Earth','Pushes objects into space','Attracts only iron','Stops all movement'],'Gravity pulls everything toward Earth. That is why a dropped ball falls.','A gravidade puxa tudo para a Terra. Por isso uma bola solta cai.'),
 QE('Gravity type','Gravity is…','A gravidade é uma força…',['a non-contact force','a contact force','a kind of friction','a kind of magnetism'],'Gravity pulls without touching: it is a non-contact force.','A gravidade puxa sem tocar: é uma força de não contato.'),
 QE('Weight unit','In which unit do we measure the force of gravity on an object (its weight)?','Em qual unidade medimos a força da gravidade sobre um objeto (seu peso)?',['Newtons (N)','Kilograms (kg)','Litres (L)','Centimetres (cm)'],'Force is measured in newtons (N). The symbol N honors Isaac Newton.','Força se mede em newtons (N). O símbolo N homenageia Isaac Newton.'),
 QE('Spring scale','Which tool measures force in newtons?','Qual instrumento mede força em newtons?',['A spring scale (newton meter)','A thermometer','A ruler','A rain gauge'],'A spring scale stretches more when the force is bigger, and shows the value in newtons.','O dinamômetro (balança de mola) estica mais quando a força é maior e mostra o valor em newtons.'),
 QE('Mass or weight','Mass is measured in kilograms. <b>Weight</b> is measured in…','A massa é medida em quilogramas. O <b>peso</b> é medido em…',['newtons','litres','degrees','metres'],'Mass is the amount of matter (kg). Weight is the pull of gravity on that mass (N).','Massa é a quantidade de matéria (kg). Peso é a atração da gravidade sobre essa massa (N).'),
 QE('Moon','An astronaut goes to the Moon, where gravity is weaker. What happens?','Um astronauta vai à Lua, onde a gravidade é mais fraca. O que acontece?',['Their weight is smaller but their mass stays the same','Their mass gets smaller but their weight stays the same','Both stay the same','Both get bigger'],'Mass does not change. Weight depends on gravity, so it is smaller on the Moon.','A massa não muda. O peso depende da gravidade, então é menor na Lua.'),
 QE('Falling','Why does an apple fall from a tree?','Por que uma maçã cai da árvore?',['Gravity pulls it toward Earth','Friction pushes it','A magnet pulls it','The wind always pushes it'],'Gravity pulls objects toward Earth.','A gravidade puxa os objetos para a Terra.'),
 QE('Spring scale reading','A spring scale shows <b>5 N</b> when an object hangs from it. What does 5 N tell us?','Um dinamômetro mostra <b>5 N</b> quando um objeto pende dele. O que 5 N indica?',['The pull of gravity on the object (its weight)','The color of the object','The temperature','The volume of the object'],'The scale measures the force of gravity pulling the object down.','O dinamômetro mede a força da gravidade puxando o objeto para baixo.')];
const SM2={id:'s2',guide:'bruno',mins:6,title:B('Gravity and weight','Gravidade e peso'),lesson:B('<div class="card"><p><b>Gravity</b> is a non-contact force that pulls objects toward the center of Earth.</p><p>The force of gravity on an object is its <b>weight</b>. We measure force in <b>newtons (N)</b> with a <b>spring scale</b>.</p><p><b>Mass</b> (kg) is the amount of matter and does not change. Weight changes when gravity changes (Moon: less gravity, less weight).</p></div>','<div class="card"><p>A <b>gravidade</b> é uma força de não contato que puxa os objetos para o centro da Terra.</p><p>A força da gravidade sobre um objeto é o seu <b>peso</b>. Medimos força em <b>newtons (N)</b> com um <b>dinamômetro</b> (balança de mola).</p><p>A <b>massa</b> (kg) é a quantidade de matéria e não muda. O peso muda quando a gravidade muda (Lua: menos gravidade, menos peso).</p></div>'),build:()=>SQ2.concat([forceFill(),forceSort()])};
const SQ3=[
 QE('Poles','What are the two ends of a magnet called?','Como se chamam as duas pontas de um ímã?',['Poles: north and south','Plus and minus','Top and bottom','Left and right'],'Every magnet has a north pole and a south pole.','Todo ímã tem um polo norte e um polo sul.'),
 QE('Like poles','What happens when two <b>like</b> poles (N-N or S-S) get close?','O que acontece quando dois polos <b>iguais</b> (N-N ou S-S) se aproximam?',['They repel (push apart)','They attract (pull together)','They melt','Nothing'],'Like poles repel.','Polos iguais se repelem.'),
 QE('Opposite poles','What happens when <b>opposite</b> poles (N-S) get close?','O que acontece quando polos <b>opostos</b> (N-S) se aproximam?',['They attract (pull together)','They repel (push apart)','They become the same','Nothing'],'Opposite poles attract.','Polos opostos se atraem.'),
 QE('Magnetic field','The area around a magnet where the magnetic force acts is called the…','A região ao redor do ímã onde a força magnética age se chama…',['magnetic field','magnetic fuel','magnetic wall','magnetic ring'],'The magnetic field is the space around a magnet where its force can be felt.','O campo magnético é o espaço ao redor do ímã onde sua força é sentida.'),
 QE('Magnetism type','Magnetism is a…','O magnetismo é uma força…',['non-contact force','contact force','kind of friction','kind of weight'],'A magnet can attract objects without touching them.','Um ímã pode atrair objetos sem tocá-los.'),
 QE('Magnetic metals','Which metal is attracted by a magnet?','Qual metal é atraído por um ímã?',['Iron','Aluminum','Gold','Copper'],'Magnets attract iron (and steel, nickel, cobalt). Aluminum, gold and copper are not magnetic.','Ímãs atraem ferro (e aço, níquel, cobalto). Alumínio, ouro e cobre não são magnéticos.')];
const MG=[['Steel paper clip','a'],['Iron nail','a'],['Steel screw','a'],['Steel can','a'],['Plastic ruler','x'],['Rubber eraser','x'],['Wooden pencil','x'],['Paper page','x'],['Glass marble','x'],['Aluminum foil','x']];
function magSort(){return SO('Attracted or not?','Is it <b>attracted</b> to a magnet or <b>not attracted</b>?','Ele é <b>atraído</b> por um ímã ou <b>não é atraído</b>?',[['a','Attracted','iron and steel'],['x','Not attracted','plastic, wood, paper, rubber']],sample(MG.filter(x=>x[1]==='a'),3).concat(sample(MG.filter(x=>x[1]==='x'),3)),t=>'<b>'+t.t+'</b> is '+(t.b==='a'?'attracted: it is made of iron or steel.':'not attracted: plastic, rubber, wood, paper, glass and aluminum are not magnetic.'),'Magnets attract iron and steel. Plastic, rubber, wood and paper are not attracted.','Ímãs atraem ferro e aço. Plástico, borracha, madeira e papel não são atraídos.')}
function magLab(){const t=pick([['two <b>north</b> poles (N and N) face each other','Repel (push apart)','N',1],['two <b>south</b> poles (S and S) face each other','Repel (push apart)','S',1],['a <b>north</b> pole faces a <b>south</b> pole (N and S)','Attract (pull together)','N',0]]);
 return {type:'magnet',left:t[2],label:'Magnet lab',q:B('Magnet lab! Press <b>Flip</b> and <b>Try it</b> to explore. Then answer: what happens when '+t[0]+'?','Laboratório de ímãs! Aperte <b>Flip</b> (virar) e <b>Try it</b> (testar). Depois responda: o que acontece quando os polos se encontram? ('+t[0].replace('two <b>north</b> poles (N and N) face each other','N com N').replace('two <b>south</b> poles (S and S) face each other','S com S').replace('a <b>north</b> pole faces a <b>south</b> pole (N and S)','N com S')+')'),opts:[opt(t[1],1),opt(t[1].indexOf('Repel')===0?'Attract (pull together)':'Repel (push apart)'),opt('Nothing happens'),opt('The magnets melt')],ex:B(t[1].indexOf('Repel')===0?'Like poles repel: they push apart.':'Opposite poles attract: they pull together.',t[1].indexOf('Repel')===0?'Polos iguais se repelem.':'Polos opostos se atraem.')}}
const SM3={id:'s3',guide:'leo',mins:7,title:B('Magnetism','Magnetismo'),lesson:B('<div class="card"><p>A <b>magnet</b> has a north pole and a south pole. <b>Like poles repel, opposite poles attract.</b></p><p>Magnetism is a <b>non-contact force</b>. The space around the magnet where the force works is the <b>magnetic field</b>. Magnets attract <b>iron and steel</b>.</p></div>','<div class="card"><p>Um <b>ímã</b> tem um polo norte e um polo sul. <b>Polos iguais se repelem, polos opostos se atraem.</b></p><p>O magnetismo é uma <b>força de não contato</b>. O espaço ao redor do ímã onde a força age é o <b>campo magnético</b>. Ímãs atraem <b>ferro e aço</b>.</p></div>'),build:()=>SQ3.concat([magLab(),magLab(),magSort(),magSort()])};
const MACH=[['Lever','A rigid bar that moves around a fixed point (the fulcrum)','seesaw'],['Inclined plane','A flat surface that is tilted; helps move objects up or down using less force','ramp'],['Wheel and axle','A circular wheel connected to a rod called an axle','doorknob or bicycle wheel'],['Pulley','A wheel with a groove and a rope or cable; changes the direction of the force','flagpole or crane'],['Wedge','A machine with a sharp edge or point, used to split, cut or separate','axe or knife']];
function machEx(){const m=pick(MACH);return QE('Machine: '+m[0],'Which simple machine is this? <b>'+m[1]+'</b>.','Qual é esta máquina simples? <b>'+m[1].replace(/^A /,'')+'</b>.',[m[0]].concat(MACH.map(x=>x[0]).filter(x=>x!==m[0]).slice(0,3)),'It is a <b>'+m[0].toLowerCase()+'</b>. Example: '+m[2]+'.','É um(a) <b>'+m[0].toLowerCase()+'</b>. Exemplo: '+m[2]+'.')}
function machEx2(){const L=[['a ramp','Inclined plane'],['a seesaw','Lever'],['an axe','Wedge'],['a bicycle wheel','Wheel and axle'],['a flagpole rope','Pulley'],['a knife','Wedge'],['a doorknob','Wheel and axle'],['a crane','Pulley']];const x=pick(L);return QE('Example: '+x[0],'Which simple machine is <b>'+x[0]+'</b>?','Qual máquina simples é <b>'+x[0]+'</b>?',[x[1]].concat(MACH.map(m=>m[0]).filter(m=>m!==x[1]).slice(0,3)),x[0].charAt(0).toUpperCase()+x[0].slice(1)+' is a(n) '+x[1].toLowerCase()+'.',x[0]+': '+x[1].toLowerCase()+'.')}
function machSort(){return SO('Match the machine','Sort each tool by the <b>simple machine</b> it uses.','Separe cada ferramenta pela <b>máquina simples</b> que usa.',[['l','Lever'],['i','Inclined plane'],['w','Wedge'],['p','Pulley']],[['Seesaw','l'],['Crowbar','l'],['Ramp','i'],['Slide','i'],['Axe','w'],['Knife','w'],['Flagpole rope','p'],['Crane','p']].slice(0,0).concat(sample([['Seesaw','l'],['Crowbar','l'],['Ramp','i'],['Slide','i'],['Axe','w'],['Knife','w'],['Flagpole rope','p'],['Crane','p']],6)),t=>'<b>'+t.t+'</b> uses a '+({l:'lever',i:'inclined plane',w:'wedge',p:'pulley'})[t.b]+'.','Lever: bar and fulcrum. Inclined plane: tilted surface. Wedge: sharp edge. Pulley: wheel and rope.','Alavanca: barra e ponto de apoio. Plano inclinado: superfície inclinada. Cunha: lâmina. Polia: roda e corda.')}
const SM4={id:'s4',guide:'rafa',mins:7,title:B('Simple machines','Máquinas simples'),lesson:B('<div class="card"><p><b>Simple machines</b> are tools that make work easier. They help us lift, move, push, pull or cut.</p>'+MACH.map(m=>'<p><b>'+m[0]+'</b>: '+m[1]+'. <i>Example: '+m[2]+'.</i></p>').join('')+'</div>','<div class="card"><p><b>Máquinas simples</b> são ferramentas que facilitam o trabalho. Elas ajudam a levantar, mover, empurrar, puxar ou cortar.</p><p><b>Alavanca</b>: barra rígida que gira em torno de um ponto fixo (o ponto de apoio). <i>Gangorra.</i></p><p><b>Plano inclinado</b>: superfície inclinada que ajuda a subir ou descer objetos com menos força. <i>Rampa.</i></p><p><b>Roda e eixo</b>: roda ligada a uma haste (eixo). <i>Maçaneta, roda da bicicleta.</i></p><p><b>Polia</b>: roda com sulco e corda; muda a direção da força. <i>Guindaste, mastro de bandeira.</i></p><p><b>Cunha</b>: peça com ponta ou lâmina; corta ou separa. <i>Machado, faca.</i></p></div>'),build:()=>[machEx(),machEx(),machEx(),machEx2(),machEx2(),machEx2(),machSort(),machSort()]};
const LVQ=[
 QE('Fulcrum','In a lever, the <b>fulcrum</b> is…','Numa alavanca, o <b>ponto de apoio</b> (fulcrum) é…',['the fixed point the bar turns around','the object being lifted','the force you push with','the longest part of the bar'],'Fulcrum = pivot point.','Fulcrum = ponto de apoio, onde a alavanca gira.'),
 QE('Load','In a lever, the <b>load</b> is…','Numa alavanca, a <b>carga</b> (load) é…',['the object being moved or lifted','the person pushing','the fixed point','the handle'],'Load = the thing you are moving.','Carga = o que está sendo movido.'),
 QE('Effort','In a lever, the <b>effort</b> is…','Numa alavanca, o <b>esforço</b> (effort) é…',['the force we apply to the lever','the weight of the load','the pivot point','the ground'],'Effort = the force you apply.','Esforço = a força que aplicamos.'),
 QE('Wheelbarrow fulcrum','In a <b>wheelbarrow</b>, what is the <b>fulcrum</b>?','Em um <b>carrinho de mão</b>, qual é o <b>ponto de apoio</b>?',['The wheel and axle','The handles','The dirt in the bucket','The ground under the wheel'],'The wheelbarrow pivots on its wheel and axle: that is the fulcrum.','O carrinho de mão gira em torno da roda e do eixo: esse é o ponto de apoio.'),
 QE('Wheelbarrow load','In a wheelbarrow, where is the <b>load</b>?','Em um carrinho de mão, onde está a <b>carga</b>?',['In the bucket (the dirt or sand)','At the handles','At the wheel','On the ground'],'The load is the material in the bucket.','A carga é o material dentro da caçamba.'),
 QE('Wheelbarrow effort','Where do we apply the <b>effort</b> in a wheelbarrow?','Onde aplicamos o <b>esforço</b> em um carrinho de mão?',['At the handles','At the wheel','In the bucket','At the front'],'We lift the handles.','Levantamos as alças.'),
 QE('Wheelbarrow class','A wheelbarrow is a…','Um carrinho de mão é uma alavanca de…',['Class 2 lever (load in the middle)','Class 1 lever (fulcrum in the middle)','Class 3 lever (effort in the middle)','not a lever'],'Class 2: the load is between the fulcrum and the effort.','Classe 2: a carga fica entre o ponto de apoio e o esforço.'),
 QE('Seesaw class','A seesaw is a…','Uma gangorra é uma alavanca de…',['Class 1 lever (fulcrum in the middle)','Class 2 lever (load in the middle)','Class 3 lever (effort in the middle)','wedge'],'Class 1: the fulcrum is between the load and the effort.','Classe 1: o ponto de apoio fica entre a carga e o esforço.'),
 QE('Tweezers class','Tweezers (or a fishing rod) are a…','Uma pinça (ou vara de pescar) é uma alavanca de…',['Class 3 lever (effort in the middle)','Class 1 lever','Class 2 lever','pulley'],'Class 3: the effort is between the fulcrum and the load.','Classe 3: o esforço fica entre o ponto de apoio e a carga.')];
const SM5={id:'s5',guide:'nico',mins:7,title:B('Levers: fulcrum, load, effort','Alavancas: apoio, carga e esforço'),lesson:B('<div class="card"><p>A lever has 3 parts: <b>fulcrum</b> (pivot), <b>load</b> (what we move) and <b>effort</b> (the force we apply).</p><div class="tripl"><div><b>Class 1</b><br>fulcrum in the middle<big>seesaw</big></div><div><b>Class 2</b><br>load in the middle<big>wheelbarrow</big></div><div><b>Class 3</b><br>effort in the middle<big>tweezers</big></div></div><p>Wheelbarrow: fulcrum = wheel and axle, load = dirt in the bucket, effort = handles.</p></div>','<div class="card"><p>Uma alavanca tem 3 partes: <b>ponto de apoio</b> (fulcrum), <b>carga</b> (o que movemos) e <b>esforço</b> (a força que aplicamos).</p><div class="tripl"><div><b>Classe 1</b><br>apoio no meio<big>gangorra</big></div><div><b>Classe 2</b><br>carga no meio<big>carrinho de mão</big></div><div><b>Classe 3</b><br>esforço no meio<big>pinça</big></div></div><p>Carrinho de mão: apoio = roda e eixo, carga = terra na caçamba, esforço = alças.</p></div>'),build:()=>LVQ.slice()};
const SQ6=[
 QE('Energy source','What is Earth\'s main source of energy?','Qual é a principal fonte de energia da Terra?',['The Sun','The Moon','The wind','The ocean'],'The Sun gives Earth energy as light and heat.','O Sol fornece energia à Terra como luz e calor.'),
 QE('Reflected','When the Sun\'s energy is <b>reflected</b>, it…','Quando a energia do Sol é <b>refletida</b>…',['bounces back into space','is stored in the ground','warms the ocean','turns into rain'],'Some of the energy is reflected back into space.','Parte da energia volta para o espaço.'),
 QE('Absorbed','When the Sun\'s energy is <b>absorbed</b> by land and oceans, it…','Quando a energia do Sol é <b>absorvida</b> pela terra e pelos oceanos…',['warms Earth\'s surface','disappears','makes the sky blue','freezes the water'],'The absorbed energy warms the land and the water.','A energia absorvida aquece a terra e a água.'),
 QE('Order','Which order is correct?','Qual é a ordem correta?',['Sun energy reaches Earth → some is reflected, some is absorbed → absorbed energy warms the surface','Earth makes energy → the Sun absorbs it → space warms','Energy is reflected → absorbed → disappears','Sun → Moon → Earth'],'Energy arrives; some is reflected; the rest is absorbed and warms Earth.','A energia chega; parte é refletida; o resto é absorvido e aquece a Terra.'),
 QE('Dark colors','Which T-shirt gets <b>hotter</b> in the sunshine?','Qual camiseta fica <b>mais quente</b> no sol?',['The black one','The white one','They are the same','The shiny silver one'],'Dark colors absorb more of the Sun\'s energy; light colors reflect more.','Cores escuras absorvem mais energia do Sol; cores claras refletem mais.'),
 QE('Snow','Why does fresh white snow stay cold in the sunshine for a while?','Por que a neve branca demora a derreter no sol?',['It reflects a lot of the Sun\'s energy','It absorbs all the energy','It makes its own heat','It is under the Moon'],'White surfaces reflect more energy, so they warm less.','Superfícies brancas refletem mais energia e esquentam menos.')];
const SM6={id:'s6',guide:'leo',mins:5,title:B('Energy from the Sun','Energia do Sol'),lesson:B('<div class="card"><p>The Sun gives Earth energy as <b>light and heat</b>. When it reaches Earth:</p><p>1. Some energy is <b>reflected</b> back into space.<br>2. Some is <b>absorbed</b> by land and oceans.<br>3. The absorbed energy <b>warms</b> Earth\'s surface.</p></div>','<div class="card"><p>O Sol dá energia à Terra em forma de <b>luz e calor</b>. Quando chega à Terra:</p><p>1. Parte da energia é <b>refletida</b> de volta ao espaço.<br>2. Parte é <b>absorvida</b> pela terra e pelos oceanos.<br>3. A energia absorvida <b>aquece</b> a superfície da Terra.</p></div>'),build:()=>SQ6.concat([SQ6[1],SQ6[2]])};
const CL=[['Cirrus','Thin, white, feather-like clouds','high in the sky'],['Cumulus','White, fluffy clouds that look like cotton balls','fair weather'],['Stratus','Low, gray clouds that cover the sky like a blanket','gray, cloudy days'],['Cumulonimbus','Very tall clouds that can bring thunderstorms','storms']];
function cloudEx(){const c=pick(CL);return QE('Cloud: '+c[0],'Which cloud is this? <b>'+c[1]+'</b>.','Qual nuvem é esta? <b>'+c[1].replace('Thin, white, feather-like clouds','Nuvens finas, brancas, parecidas com penas').replace('White, fluffy clouds that look like cotton balls','Nuvens brancas e fofas, parecidas com algodão').replace('Low, gray clouds that cover the sky like a blanket','Nuvens baixas e cinzentas que cobrem o céu como um cobertor').replace('Very tall clouds that can bring thunderstorms','Nuvens muito altas que podem trazer tempestades')+'</b>.',[c[0]].concat(CL.map(x=>x[0]).filter(x=>x!==c[0])),c[0]+': '+c[1].toLowerCase()+'.',c[0]+': '+c[2]+'.')}
function cloudRev(){const c=pick(CL);return QE('Looks of '+c[0],'What does a <b>'+c[0]+'</b> cloud look like?','Como é uma nuvem <b>'+c[0]+'</b>?',[c[1]].concat(CL.map(x=>x[1]).filter(x=>x!==c[1])),c[0]+' clouds: '+c[1].toLowerCase()+'.',c[0]+': '+c[2]+'.')}
const CLQ=[
 QE('Before a storm','Which clouds might you see <b>before a thunderstorm</b>?','Quais nuvens você pode ver <b>antes de uma tempestade</b>?',['Cumulonimbus','Cirrus','Cumulus','Stratus'],'Cumulonimbus clouds are very tall and bring thunderstorms.','Cumulonimbus são muito altas e trazem tempestades.'),
 QE('Feathers','Which clouds look like thin <b>feathers</b>?','Quais nuvens parecem finas <b>penas</b>?',['Cirrus','Stratus','Cumulonimbus','Cumulus'],'Cirrus clouds are thin, white and feather-like.','Cirrus são finas, brancas e parecem penas.'),
 QE('Gray blanket','Which clouds can cover the sky like a <b>gray blanket</b>?','Quais nuvens cobrem o céu como um <b>cobertor cinza</b>?',['Stratus','Cirrus','Cumulus','Cumulonimbus'],'Stratus clouds form a low, gray layer.','Stratus formam uma camada baixa e cinza.'),
 QE('Fair weather','Which clouds are white and fluffy and usually seen in <b>fair weather</b>?','Quais nuvens são brancas e fofas, vistas geralmente em <b>tempo bom</b>?',['Cumulus','Stratus','Cumulonimbus','Cirrus'],'Cumulus clouds look like cotton balls and appear in fair weather.','Cumulus parecem algodão e aparecem com tempo bom.')];
function cloudSort(){return SO('Name the cloud','Sort the clues by <b>type of cloud</b>.','Separe as pistas pelo <b>tipo de nuvem</b>.',[['ci','Cirrus'],['cu','Cumulus'],['st','Stratus'],['cb','Cumulonimbus']],sample([['Feather-like','ci'],['High and thin','ci'],['Cotton balls','cu'],['Fair weather','cu'],['Gray blanket','st'],['Low gray layer','st'],['Very tall','cb'],['Thunderstorms','cb']],6),t=>'<b>'+t.t+'</b> goes with '+({ci:'cirrus',cu:'cumulus',st:'stratus',cb:'cumulonimbus'})[t.b]+'.','Cirrus: feathers. Cumulus: cotton balls. Stratus: gray blanket. Cumulonimbus: tall, storms.','Cirrus: penas. Cumulus: algodão. Stratus: cobertor cinza. Cumulonimbus: altas, tempestades.')}
const SM7={id:'s7',guide:'duda',mins:6,title:B('Clouds','Tipos de nuvens'),lesson:B('<div class="card">'+CL.map(c=>'<p><b>'+c[0]+'</b>: '+c[1]+'.</p>').join('')+'</div>','<div class="card"><p><b>Cirrus</b>: nuvens finas, brancas e parecidas com penas.</p><p><b>Cumulus</b>: nuvens brancas e fofas, como algodão, de tempo bom.</p><p><b>Stratus</b>: nuvens baixas e cinzentas, cobrem o céu como um cobertor.</p><p><b>Cumulonimbus</b>: nuvens muito altas, trazem tempestades.</p></div>'),build:()=>[cloudEx(),cloudEx(),cloudEx(),cloudRev(),cloudRev()].concat(CLQ,[cloudSort()])};
const INS=[['Thermometer','temperature'],['Rain gauge','the amount of rain that falls'],['Anemometer','wind speed (how fast the wind blows)'],['Wind vane','wind direction'],['Barometer','air pressure'],['Weather satellite','takes pictures of clouds, storms and Earth from space'],['Weather radar','detects rain, storms and the movement of precipitation'],['Weather balloon','measures conditions high in the atmosphere']];
function insEx(){const i=pick(INS);return QE('Instrument: '+i[0],'What does a <b>'+i[0].toLowerCase()+'</b> do?','O que faz um(a) <b>'+({Thermometer:'termômetro','Rain gauge':'pluviômetro',Anemometer:'anemômetro','Wind vane':'biruta / catavento',Barometer:'barômetro','Weather satellite':'satélite meteorológico','Weather radar':'radar meteorológico','Weather balloon':'balão meteorológico'})[i[0]]+'</b>?',[i[1]].concat(INS.map(x=>x[1]).filter(x=>x!==i[1]).slice(0,3)),'A '+i[0].toLowerCase()+': '+i[1]+'.',i[0]+': '+i[1]+'.')}
function insRev(){const i=pick(INS.slice(0,5));return QE('Measure: '+i[1],'Which instrument measures <b>'+i[1]+'</b>?','Qual instrumento mede <b>'+i[1]+'</b>?',[i[0]].concat(INS.slice(0,5).map(x=>x[0]).filter(x=>x!==i[0]).slice(0,3)),i[0]+' measures '+i[1]+'.',i[0]+' mede: '+i[1]+'.')}
const SEV=[['Thunderstorm','a storm with heavy rain, lightning and thunder'],['Flood','too much water covering land that is usually dry'],['Tornado','a rotating, funnel-shaped column of wind that touches the ground'],['Hurricane','a huge storm over the ocean with strong winds and heavy rain'],['Drought','a long period without enough rain']];
function sevEx(){const s=pick(SEV);return QE('Severe weather: '+s[0],'Which severe weather is this? <b>'+s[1]+'</b>.','Qual é este fenômeno? <b>'+s[1].replace('a storm with heavy rain, lightning and thunder','tempestade com chuva forte, raios e trovões').replace('too much water covering land that is usually dry','excesso de água cobrindo terra normalmente seca').replace('a rotating, funnel-shaped column of wind that touches the ground','coluna de vento giratória em forma de funil que toca o solo').replace('a huge storm over the ocean with strong winds and heavy rain','enorme tempestade sobre o oceano, com ventos fortes e chuva intensa').replace('a long period without enough rain','longo período sem chuva suficiente')+'</b>.',[s[0]].concat(SEV.map(x=>x[0]).filter(x=>x!==s[0]).slice(0,3)),s[0]+': '+s[1]+'.',s[0]+': '+({Thunderstorm:'tempestade com chuva forte, raios e trovões',Flood:'enchente: excesso de água sobre terra seca',Tornado:'coluna de vento giratória que toca o solo',Hurricane:'enorme tempestade sobre o oceano com ventos fortes e chuva intensa',Drought:'longo período sem chuva suficiente'})[s[0]])}
const TFS=[['An anemometer measures how fast the wind blows.',1,'Anemometer = wind speed. True.'],['A barometer measures the amount of rainfall.',0,'False: a rain gauge measures rainfall. A barometer measures air pressure.'],['A weather satellite takes pictures of clouds and storms from space.',1,'True: satellites orbit Earth and photograph the weather.'],['A thermometer measures temperature.',1,'True.'],['A wind vane shows wind direction.',1,'True.'],['A drought is too much rain.',0,'False: a drought is a long period without enough rain.'],['A flood is a lot of water covering land that is usually dry.',1,'True.']];
function tfEx(){const t=pick(TFS);return QE('True or false',t[0]+' <b>True or false?</b>',t[0]+' <b>Verdadeiro ou falso?</b>',[t[1]?'True':'False',t[1]?'False':'True'].concat([]),t[2],t[2])}
function insSort(){return SO('Weather instruments','Match each instrument with what it <b>measures or does</b>.','Ligue cada instrumento ao que ele <b>mede ou faz</b>.',[['t','Temperature'],['w','Wind'],['r','Rain'],['s','Pictures from space']],[['Thermometer','t'],['Anemometer','w'],['Wind vane','w'],['Rain gauge','r'],['Weather satellite','s'],['Barometer','t']].filter(x=>x[0]!=='Barometer'),t=>'<b>'+t.t+'</b> goes here.','Thermometer: temperature. Anemometer and wind vane: wind. Rain gauge: rain. Satellite: pictures from space.','Termômetro: temperatura. Anemômetro e catavento: vento. Pluviômetro: chuva. Satélite: imagens do espaço.')}
const SM8={id:'s8',guide:'rafa',mins:8,title:B('Weather instruments and severe weather','Instrumentos e clima severo'),lesson:B('<div class="card">'+INS.map(i=>'<p><b>'+i[0]+'</b>: '+i[1]+'.</p>').join('')+'</div><div class="card">'+SEV.map(i=>'<p><b>'+i[0]+'</b>: '+i[1]+'.</p>').join('')+'</div>','<div class="card"><p><b>Termômetro</b>: temperatura. <b>Pluviômetro</b>: quantidade de chuva. <b>Anemômetro</b>: velocidade do vento. <b>Catavento</b> (wind vane): direção do vento. <b>Barômetro</b>: pressão do ar. <b>Satélite</b>: fotos do espaço. <b>Radar</b>: detecta chuva e tempestades. <b>Balão meteorológico</b>: mede condições no alto da atmosfera.</p></div><div class="card"><p><b>Tempestade</b> (thunderstorm): chuva forte, raios e trovões. <b>Enchente</b> (flood): muita água sobre terra seca. <b>Tornado</b>: coluna de vento giratória. <b>Furacão</b> (hurricane): enorme tempestade sobre o oceano. <b>Seca</b> (drought): longo período sem chuva.</p></div>'),build:()=>[insEx(),insEx(),insEx(),insRev(),insRev(),insRev(),sevEx(),sevEx(),sevEx(),sevEx(),tfEx(),tfEx(),tfEx(),insSort()]};

const REG={N:['Norte',['Acre','Amapá','Amazonas','Pará','Rondônia','Roraima','Tocantins']],NE:['Nordeste',['Alagoas','Bahia','Ceará','Maranhão','Paraíba','Pernambuco','Piauí','Rio Grande do Norte','Sergipe']],CO:['Centro-Oeste',['Distrito Federal','Goiás','Mato Grosso','Mato Grosso do Sul']],SE:['Sudeste',['Espírito Santo','Minas Gerais','Rio de Janeiro','São Paulo']],S:['Sul',['Paraná','Rio Grande do Sul','Santa Catarina']]};
const REGN=k=>REG[k][0];
function stateSort(){const keys=['N','NE','CO','SE','S'];const pickK=sample(keys,Math.random()<.5?3:4);const it=[];pickK.forEach(k=>sample(REG[k][1],2).forEach(s=>it.push([s,k])));
 return SOP('Estados e regiões','Arraste cada estado para a sua <b>região</b>.',pickK.map(k=>[k,REGN(k)]),it,t=>'<b>'+t.t+'</b> fica na região <b>'+REGN(t.b)+'</b>.','O Brasil tem 5 regiões: Norte, Nordeste, Centro-Oeste, Sudeste e Sul.')}
function stateEx(){const k=pick(Object.keys(REG)),s=pick(REG[k][1]);return QP('Região de '+s,'Em qual região fica o estado <b>'+s+'</b>?',[REGN(k)].concat(Object.keys(REG).filter(x=>x!==k).map(REGN)).slice(0,4),s+' fica na região '+REGN(k)+'.')}
const CAPS=[['Manaus','Amazonas','N'],['Belém','Pará','N'],['Salvador','Bahia','NE'],['Recife','Pernambuco','NE'],['São Luís','Maranhão','NE'],['Brasília','Distrito Federal','CO'],['Goiânia','Goiás','CO'],['Cuiabá','Mato Grosso','CO'],['Campo Grande','Mato Grosso do Sul','CO'],['São Paulo','São Paulo','SE'],['Rio de Janeiro','Rio de Janeiro','SE'],['Belo Horizonte','Minas Gerais','SE'],['Curitiba','Paraná','S'],['Florianópolis','Santa Catarina','S'],['Porto Alegre','Rio Grande do Sul','S']];
function capEx(){const c=pick(CAPS);return QP('Região de '+c[0],'A cidade de <b>'+c[0]+'</b> fica em qual região do Brasil?',[REGN(c[2])].concat(Object.keys(REG).filter(x=>x!==c[2]).map(REGN)).slice(0,4),c[0]+' é capital de '+c[1]+', na região '+REGN(c[2])+'.')}
const GQ0=[
 QP('País continental','Por que o Brasil é chamado de <b>país continental</b>?',['Porque tem um território muito grande, de tamanho quase de um continente','Porque fica em todos os continentes','Porque só tem praias','Porque é uma ilha'],'O Brasil é enorme e é dividido em 5 regiões.'),

const GM1={id:'g1',guide:'bruno',mins:7,title:'Brasil: país continental e suas regiões',lesson:'<div class="card"><p>O Brasil é um <b>país continental</b>: tem um território enorme. Ele é dividido em <b>5 regiões</b>:</p><div class="tripl"><div><b>Norte</b><br>7 estados<big>Amazônia</big></div><div><b>Nordeste</b><br>9 estados<big>Salvador</big></div><div><b>Centro-Oeste</b><br>3 estados + DF<big>Brasília</big></div><div><b>Sudeste</b><br>4 estados<big>São Paulo</big></div><div><b>Sul</b><br>3 estados<big>Itaipu</big></div></div></div>',build:()=>GQ0.concat([stateSort(),stateSort(),stateEx(),stateEx(),capEx(),capEx(),capEx()])};

const GM2={id:'g2',guide:'leo',mins:7,title:'Região Norte',lesson:'<div class="card"><p>A região <b>Norte</b> é a <b>maior</b> do Brasil. Nela fica a <b>Floresta Amazônica</b>, e a <b>Linha do Equador</b> passa por lá. O clima é <b>equatorial</b>: quente e úmido, com muita chuva.</p><p><b>Extrativismo vegetal:</b> açaí, castanha, madeira. <b>Extrativismo mineral:</b> ferro, bauxita, ouro, manganês.</p><p>É preciso explorar com <b>responsabilidade</b>, respeitando a natureza e os <b>direitos dos povos indígenas</b>.</p></div>',build:()=>NQ.concat([resSort(),resSort(),stateEx(),capEx()])};

const GM3={id:'g3',guide:'nico',mins:8,title:'Centro-Oeste e Nordeste',lesson:'<div class="card"><p><b>Centro-Oeste:</b> Goiás, Mato Grosso, Mato Grosso do Sul e o Distrito Federal. Brasília, a capital, foi inaugurada em <b>1960</b>. Vegetação: <b>Cerrado</b>. Economia: <b>agricultura e pecuária</b>. As <b>rodovias</b> ligam a região ao resto do país.</p></div><div class="card"><p><b>Nordeste:</b> <b>9 estados</b>. Tem <b>centros históricos</b> importantes: Salvador, Olinda, São Luís. Foi colonizado pelos <b>portugueses</b>, com grandes contribuições <b>indígenas</b> e <b>africanas</b>.</p></div>',build:()=>CQ.concat(NEQ,[stateSort(),stateEx()])};
