const CARACT=[['Maior região em extensão','N'],['Floresta Amazônica','N'],['Açaí e castanha','N'],['Brasília, capital federal','CO'],['Cerrado','CO'],['Agricultura e pecuária','CO'],['Salvador, Olinda e São Luís','NE'],['9 estados','NE'],['Região mais populosa','SE'],['Muitas indústrias e grandes cidades','SE'],['Itaipu e Foz do Iguaçu','S'],['Colonização europeia','S']];
function caractSort(){const ks=['N','CO','NE','SE','S'];const k3=sample(ks,3);const it=[];k3.forEach(k=>sample(CARACT.filter(c=>c[1]===k),2).forEach(c=>it.push(c)));
 return SOP('Característica e região','Ligue cada característica à <b>região</b>.',k3.map(k=>[k,REGN(k)]),it,t=>'<b>'+t.t+'</b> é da região <b>'+REGN(t.b)+'</b>.','Cada região tem características próprias.')}
function visitEx(){const L=[['Quero ver a Floresta Amazônica e conhecer o extrativismo do açaí.','Norte'],['Quero visitar Brasília, a capital federal.','Centro-Oeste'],['Quero conhecer o centro histórico de Salvador.','Nordeste'],['Quero visitar a usina de Itaipu e as Cataratas do Iguaçu.','Sul'],['Quero conhecer uma região muito populosa, com indústrias e grandes cidades.','Sudeste']];const x=pick(L);
 return QP('Que região visitar',x[0]+'<br>Qual região do Brasil você deve visitar?',[x[1]].concat(['Norte','Nordeste','Centro-Oeste','Sudeste','Sul'].filter(r=>r!==x[1]).slice(0,3)),'A região certa é <b>'+x[1]+'</b>.')}
const GM4={id:'g4',guide:'rafa',mins:8,title:'Sudeste e Sul',lesson:'<div class="card"><p><b>Sudeste:</b> ES, MG, RJ e SP. Região <b>mais populosa</b>, com <b>indústria e serviços</b> e as maiores cidades do país.</p><p><b>Sul:</b> PR, SC e RS. Tem <b>Foz do Iguaçu</b> e a usina hidrelétrica de <b>Itaipu</b>, influência da <b>colonização europeia</b> e muita <b>agricultura</b>.</p></div>',build:()=>SSQ.concat([caractSort(),caractSort(),visitEx(),visitEx(),stateEx()])};

const BIOQ=[
 QE('What is a biography','What does a <b>biography</b> tell?','O que uma <b>biografia</b> conta?',['The story of a real person\'s life','A made-up adventure','The rules of a game','A recipe'],'A biography tells the story of a real person\'s life.','Uma biografia conta a história da vida de uma pessoa real.'),
 QE('Who writes it','Who writes a biography?','Quem escreve uma biografia?',['Someone else, not the person themselves','Always the person themselves','A robot only','Nobody'],'A biography is written by another person. When we write our own life story, it is an autobiography.','A biografia é escrita por outra pessoa. Quando a pessoa escreve a própria história, é uma autobiografia.'),
 QE('Chronological','Biographies often tell events in…','As biografias costumam contar os fatos em…',['chronological order (the order they happened)','random order','reverse alphabetical order','the order of the longest words'],'Chronological order: from childhood to later achievements.','Ordem cronológica: da infância até as conquistas posteriores.'),
 QE('Facts','Biographies are based on…','As biografias são baseadas em…',['research and facts','imagination only','jokes','dreams'],'The writer researches real facts.','O autor pesquisa fatos reais.'),
 QE('Purpose','What is the main purpose of a biography?','Qual é o objetivo principal de uma biografia?',['To inform readers about a person\'s life','To convince readers to agree with an opinion','To make readers laugh','To sell a product'],'The main purpose is to inform. Persuasive texts convince.','O objetivo é informar. Textos persuasivos é que convencem.'),
 QE('Third person','Why does the Marie Curie biography use <b>she</b> and <b>her</b> instead of <b>I</b> and <b>my</b>?','Por que a biografia de Marie Curie usa <b>she</b> e <b>her</b> em vez de <b>I</b> e <b>my</b>?',['Because it is written in the third person, by someone else','Because Marie wrote it herself','Because it is a fantasy','Because it is a poem'],'Biographies use the third person (he, she, they).','Biografias usam a terceira pessoa (he, she, they).'),
 QE('Marie Curie: born','Where was Marie Curie born?','Onde Marie Curie nasceu?',['Warsaw, Poland','Paris, France','Berlin, Germany','Rome, Italy'],'Marie was born in 1867 in Warsaw, Poland.','Marie nasceu em 1867, em Varsóvia, na Polônia.'),
 QE('Marie Curie: why Paris','Why did Marie move to Paris in 1891?','Por que Marie se mudou para Paris em 1891?',['Poland had very few opportunities for women to study','She wanted to be a singer','She was a tourist','Her teacher asked her to'],'Women were not allowed to enroll in universities in Poland, so she studied physics and mathematics at the Sorbonne in France.','Mulheres não podiam entrar nas universidades da Polônia, então ela estudou física e matemática na Sorbonne, na França.'),
 QE('Radioactivity','What did Marie Curie call the energy released by certain elements?','Como Marie Curie chamou a energia liberada por certos elementos?',['Radioactivity','Electricity','Gravity','Magnetism'],'She called this phenomenon radioactivity and discovered two new elements: polonium and radium.','Ela chamou esse fenômeno de radioatividade e descobriu dois elementos: polônio e rádio.'),
 QE('Nobel prizes','Marie Curie won the Nobel Prize in Physics (1903) and in…','Marie Curie ganhou o Nobel de Física (1903) e o de…',['Chemistry (1911)','Peace (1911)','Literature (1911)','Medicine (1903)'],'She was the first woman to win a Nobel Prize, and won again in Chemistry in 1911.','Ela foi a primeira mulher a ganhar um Nobel e ganhou de novo, em Química, em 1911.')];
function curieOrder(){const E=[['Born in Warsaw',1867],['Moves to Paris to study',1891],['Marries Pierre Curie',1895],['Discovers polonium and radium',1898],['Wins the Nobel Prize in Physics',1903],['Wins the Nobel Prize in Chemistry',1911],['Dies',1934]];const s=sample(E,4);
 return {type:'order',label:'Linha do tempo de Marie Curie',q:B('Tap the events of Marie Curie\'s life in <b>chronological order</b> (first to last).','Toque nos fatos da vida de Marie Curie em <b>ordem cronológica</b> (do primeiro ao último).'),items:s.map(x=>({v:x[1],t:x[0]+' ('+x[1]+')'})),desc:false,ex:B(s.slice().sort((a,b)=>a[1]-b[1]).map(x=>x[1]+': '+x[0]).join('; ')+'.','Ordem: '+s.slice().sort((a,b)=>a[1]-b[1]).map(x=>x[1]).join(', ')+'.')}}
function bioTF(){const T=[['A biography tells the story of a real person\'s life.',1],['A biography is always written by the person whose life is described.',0],['Biographies often describe events in chronological order.',1],['Biographies are based on research and facts.',1],['The main purpose of a biography is to convince readers to agree with the writer.',0],['A biography uses the third person (he, she).',1]];const t=pick(T);
 return QE('True or false',t[0]+' <b>True or false?</b>',t[0]+' <b>Verdadeiro ou falso?</b>',[t[1]?'True':'False',t[1]?'False':'True'],t[1]?'True.':'False. Remember: biography = written by someone else, based on facts, chronological, informs.','Se for falso, lembre: biografia = escrita por outra pessoa, baseada em fatos, cronológica, informa.')}
const EM1={id:'e1',guide:'leo',mins:9,title:B('Biographies: Marie Curie','Biografias: Marie Curie'),lesson:B('<div class="card"><p>A <b>biography</b> tells the story of a real person\'s life. Characteristics: <b>nonfiction</b>, written in the <b>third person</b> (he, she), based on <b>research</b>, usually in <b>chronological order</b>, and its purpose is to <b>inform</b>.</p><p>Marie Curie timeline: <b>1867</b> born in Warsaw → <b>1891</b> moves to Paris → <b>1895</b> marries Pierre → <b>1898</b> discovers polonium and radium → <b>1903</b> Nobel Prize in Physics → <b>1911</b> Nobel Prize in Chemistry → <b>1934</b> dies.</p></div>','<div class="card"><p>Uma <b>biografia</b> conta a vida de uma pessoa real. Características: <b>não ficção</b>, escrita na <b>terceira pessoa</b> (ele, ela), baseada em <b>pesquisa</b>, geralmente em <b>ordem cronológica</b>, com o objetivo de <b>informar</b>.</p><p>Linha do tempo de Marie Curie: <b>1867</b> nasce em Varsóvia → <b>1891</b> vai para Paris → <b>1895</b> casa com Pierre → <b>1898</b> descobre polônio e rádio → <b>1903</b> Nobel de Física → <b>1911</b> Nobel de Química → <b>1934</b> morre.</p></div>'),build:()=>BIOQ.concat([curieOrder(),curieOrder(),bioTF(),bioTF()])};

const STY=[['My brother plays soccer every Saturday.','a'],['She likes pizza.','a'],['Do you know the answer?','q'],['Where are my shoes?','q'],['Please put your books away.','i'],['Close the door quietly.','i'],['We did not finish the project.','n'],['I never eat spinach.','n'],['What a wonderful performance!','e'],['How fast he runs!','e'],['The sun is bright today.','a'],['Is it raining?','q'],['Open your notebooks.','i'],['They do not have a dog.','n']];
const STN={a:'Affirmative',n:'Negative',q:'Interrogative',i:'Imperative',e:'Exclamatory'};
const STX={a:'an affirmative sentence: it states a fact and ends with a period.',n:'a negative sentence: it says something is not true (not, never, no).',q:'an interrogative sentence: it asks a question and ends with a question mark.',i:'an imperative sentence: it gives a command or instruction.',e:'an exclamatory sentence: it shows strong feeling and ends with an exclamation mark.'};
function styEx(){const s=pick(STY);return QE('Kind of sentence','What kind of sentence is this? <br><i>“'+s[0]+'”</i>','Que tipo de frase é esta? <br><i>“'+s[0]+'”</i>',[STN[s[1]]].concat(Object.keys(STN).filter(k=>k!==s[1]).map(k=>STN[k]).slice(0,3)),'It is '+STX[s[1]],'É uma frase: '+STN[s[1]].toLowerCase()+'.')}
function stySort(){return SO('Sort the sentences','Sort the sentences by <b>kind</b>.','Separe as frases por <b>tipo</b>.',Object.keys(STN).map(k=>[k,STN[k]]),(()=>{const out=[];Object.keys(STN).forEach(k=>out.push(pick(STY.filter(s=>s[1]===k)).slice(0,2)));return out.slice(0,5)})(),t=>'<b>'+t.t+'</b> is '+STX[t.b],'Affirmative: fact. Negative: not. Interrogative: question. Imperative: command. Exclamatory: strong feeling.','Afirmativa: fato. Negativa: not. Interrogativa: pergunta. Imperativa: ordem. Exclamativa: emoção forte.')}
const STQ=[
 QE('Punctuation: question','Which punctuation mark ends an <b>interrogative</b> sentence?','Qual sinal termina uma frase <b>interrogativa</b>?',['Question mark (?)','Period (.)','Exclamation mark (!)','Comma (,)'],'Interrogative sentences ask questions and end with ?','Frases interrogativas fazem perguntas e terminam com ?'),
 QE('Imperative','An <b>imperative</b> sentence…','Uma frase <b>imperativa</b>…',['gives a command or makes a request','asks a question','shows strong surprise','says something is not true'],'Example: Close the door quietly. The subject "you" is understood.','Exemplo: Close the door quietly. O sujeito "you" fica implícito.'),

const EM2={id:'e2',guide:'rafa',mins:6,title:B('Types of sentences','Tipos de frases'),lesson:B('<div class="card"><div class="tripl"><div><b>Affirmative</b><big>I like soccer.</big>states a fact .</div><div><b>Negative</b><big>I do not like rain.</big>not, never, no</div><div><b>Interrogative</b><big>Do you play?</big>question ?</div><div><b>Imperative</b><big>Pass the ball!</big>command</div><div><b>Exclamatory</b><big>What a goal!</big>strong feeling !</div></div></div>','<div class="card"><p><b>Affirmativa</b>: afirma um fato (termina com ponto). <b>Negativa</b>: diz que algo não é verdade (not, never, no). <b>Interrogativa</b>: pergunta (?). <b>Imperativa</b>: ordem ou pedido. <b>Exclamativa</b>: emoção forte (!).</p></div>'),build:()=>[styEx(),styEx(),styEx(),styEx(),styEx(),styEx()].concat(STQ,[stySort(),stySort()])};

function prnSort(){return SO('Kinds of pronouns','Sort each word by the <b>kind of pronoun</b>.','Separe cada palavra pelo <b>tipo de pronome</b>.',[['s','Subject / object'],['p','Possessive'],['r','Reflexive'],['d','Demonstrative']],sample([['he','s'],['they','s'],['them','s'],['mine','p'],['yours','p'],['theirs','p'],['himself','r'],['themselves','r'],['myself','r'],['these','d'],['that','d'],['those','d']],6),t=>'<b>'+t.t+'</b> is a '+({s:'personal',p:'possessive',r:'reflexive',d:'demonstrative'})[t.b]+' pronoun.','Personal: I, he, they, me, them. Possessive: mine, yours, theirs. Reflexive: -self / -selves. Demonstrative: this, that, these, those.','Pessoais: I, he, they, me, them. Possessivos: mine, yours, theirs. Reflexivos: -self/-selves. Demonstrativos: this, that, these, those.')}
const EM3={id:'e3',guide:'nico',mins:8,title:B('Pronouns','Pronomes'),lesson:B('<div class="card"><p><b>Personal:</b> I/me, you, he/him, she/her, it, we/us, they/them.<br><b>Possessive:</b> mine, yours, his, hers, ours, theirs.<br><b>Reflexive:</b> myself, yourself, himself, herself, itself, ourselves, themselves.<br><b>Demonstrative:</b> this, that, these, those.</p><p><b>Relative:</b> <b>who</b> (people), <b>which</b> (things), <b>where</b> (places), <b>whose</b> (possession), <b>that</b> (people or things).</p></div>','<div class="card"><p><b>Pessoais:</b> I/me, you, he/him, she/her, it, we/us, they/them.<br><b>Possessivos:</b> mine, yours, his, hers, ours, theirs.<br><b>Reflexivos:</b> myself, yourself, himself, herself, itself, ourselves, themselves.<br><b>Demonstrativos:</b> this, that, these, those.</p><p><b>Relativos:</b> <b>who</b> (pessoas), <b>which</b> (coisas), <b>where</b> (lugares), <b>whose</b> (posse), <b>that</b> (pessoas ou coisas).</p></div>'),build:()=>PRN.concat([prnSort(),prnSort()])};

const IRR=[['go','went','gone','going'],['eat','ate','eaten','eating'],['write','wrote','written','writing'],['see','saw','seen','seeing'],['take','took','taken','taking'],['begin','began','begun','beginning'],['swim','swam','swum','swimming'],['give','gave','given','giving'],['know','knew','known','knowing'],['run','ran','run','running'],['kick','kicked','kicked','kicking'],['play','played','played','playing']];
function verbForm(){const v=pick(IRR),k=rnd(1,3);const nm=['','past tense','past participle','present participle (-ing)'][k];const pt=['','passado simples','particípio passado','gerúndio (-ing)'][k];
 return QE('Verb forms: '+v[0],'What is the <b>'+nm+'</b> of the verb <b>'+v[0]+'</b>?','Qual é o <b>'+pt+'</b> do verbo <b>'+v[0]+'</b>?',[v[k]].concat(uniq([v[0],v[1],v[2],v[3],v[0]+'ed',v[0]+'s'].filter(x=>x!==v[k])).slice(0,3)),v[0]+' → '+v[1]+' → '+v[2]+' (-ing: '+v[3]+').',v[0]+' → '+v[1]+' → '+v[2]+' ('+v[3]+').')}
const VAS=[['run','a'],['kick','a'],['jump','a'],['write','a'],['is','s'],['are','s'],['was','s'],['seem','s'],['feel','s'],['become','s'],['score','a'],['am','s']];
function verbSort(){return SO('Action or state?','Is each verb an <b>action verb</b> or a <b>state of being verb</b>?','Cada verbo é de <b>ação</b> ou de <b>estado</b>?',[['a','Action verb','run, kick'],['s','State of being','is, are, was, seem']],sample(VAS.filter(x=>x[1]==='a'),3).concat(sample(VAS.filter(x=>x[1]==='s'),3)),t=>'<b>'+t.t+'</b> is '+(t.b==='a'?'an action verb: it shows something someone does.':'a state of being verb: it links a subject to a state or description.'),'Action verbs show what someone does. State of being verbs (be, seem, feel, become) describe how things are.','Verbos de ação mostram o que alguém faz. Verbos de estado (be, seem, feel, become) descrevem como as coisas são.')}

function verbTense(){const L=[['Yesterday, Lucas ___ to the stadium.','went',['go','gone','going']],['Every day, she ___ her homework.','does',['did','done','doing']],['Right now, they are ___ lunch.','eating',['eat','ate','eaten']],['Last week, I ___ a goal!','scored',['score','scoring','scores']],['He has ___ his homework already.','finished',['finish','finishes','finishing']],['She has ___ the book twice.','read',['reads','reading','readed']]];const x=pick(L);return QE('Verb tense',x[0].replace('___','<b>___</b>')+'','Complete: '+x[0].replace('___','<b>___</b>'),[x[1]].concat(x[2]),'Use the form that matches the time words: yesterday/last week = past; right now = -ing; has/have = past participle.','Use a forma que combina com as palavras de tempo: yesterday/last week = passado; right now = -ing; has/have = particípio.')}
const EM4={id:'e4',guide:'bruno',mins:8,title:B('Verbs','Verbos'),lesson:B('<div class="card"><p><b>Action verbs</b> show what someone does: run, kick, write. <b>State of being verbs</b> describe how things are: is, am, are, was, seem, feel.</p><p>Forms: <b>present</b> (go), <b>past</b> (went), <b>past participle</b> (gone), <b>present participle</b> (going).</p></div>','<div class="card"><p><b>Verbos de ação</b> mostram o que alguém faz: run, kick, write. <b>Verbos de estado</b> descrevem como as coisas são: is, am, are, was, seem, feel.</p><p>Formas: <b>presente</b> (go), <b>passado</b> (went), <b>particípio passado</b> (gone), <b>particípio presente</b> (going).</p></div>'),build:()=>[verbSort(),verbSort(),verbFind(),verbFind(),verbFind(),verbForm(),verbForm(),verbForm(),verbForm(),verbTense(),verbTense(),verbTense()]};

const APS=[['Lucas','backpack','Lucas\'s backpack'],['Sophia','colored pencils','Sophia\'s colored pencils'],['my brother','bicycle','my brother\'s bicycle'],['the teacher','desk','the teacher\'s desk'],['Ben','favorite subject','Ben\'s favorite subject'],['the dog','bone','the dog\'s bone']];
const APP=[['the students','books','the students\' books'],['the players','boots','the players\' boots'],['my parents','car','my parents\' car'],['the girls','team','the girls\' team'],['the children','toys','the children\'s toys'],['the men','coats','the men\'s coats']];
function apEx(){const plural=Math.random()<.45;const x=pick(plural?APP:APS);const wr=plural?[x[0]+'s '+x[1],x[0].replace(/s$/,'')+'\'s '+x[1],x[0]+'\'s '+x[1]]:[x[0]+'s '+x[1],x[0]+'\' '+x[1],x[0]+'\'s\' '+x[1]];

 return QE('Possessive: '+x[0],'Which is the correct way to write <b>“the '+x[1]+' of '+x[0]+'”</b> with an apostrophe?','Qual é a forma correta de escrever <b>“'+x[1]+' de '+x[0]+'”</b> com apóstrofo?',[right].concat(wrongs),plural?'Plural noun ending in -s: add an apostrophe after the s (students\'). Irregular plurals (children, men) take \'s.':'Singular noun: add \'s.',plural?'Plural terminado em s: apóstrofo depois do s. Plurais irregulares (children, men) levam \'s.':'Substantivo no singular: acrescente \'s.')}
function apRewrite(){const x=pick(APS);return QE('Rewrite: '+x[0]+' '+x[1],'Rewrite with an apostrophe: <b>the '+x[1]+' of '+x[0]+'</b>','Reescreva com apóstrofo: <b>'+x[1]+' de '+x[0]+'</b>',[x[2].replace(/^[a-z]/,c=>c)].concat([x[0]+' '+x[1],x[0]+'s '+x[1],x[0]+'\' '+x[1]]),'Singular owner: add \'s → '+x[2]+'.','Dono no singular: \'s → '+x[2]+'.')}
function apSort(){return SO('Singular or plural owner?','Where does the apostrophe go?','Onde fica o apóstrofo?',[['s','Singular owner: \'s'],['p','Plural owner (-s): s\''],['i','Irregular plural: \'s']],[['the girl\'s bag','s'],['the boy\'s ball','s'],['the girls\' bags','p'],['the boys\' balls','p'],['the children\'s toys','i'],['the women\'s team','i']],t=>'<b>'+t.t+'</b>: '+(t.b==='s'?'one owner, so add \'s.':t.b==='p'?'more than one owner and the plural ends in -s, so the apostrophe goes after the s.':'irregular plural (children, women, men): add \'s.'),'One owner: \'s. Plural ending in s: s\'. Irregular plural: \'s.','Um dono: \'s. Plural em s: s\'. Plural irregular: \'s.')}
const EM5={id:'e5',guide:'duda',mins:6,title:B('Possessive apostrophes','Apóstrofo de posse'),lesson:B('<div class="card"><p>Use an apostrophe to show who owns something.</p><div class="tripl"><div>Singular<big>Lucas\'s backpack</big>add \'s</div><div>Plural with -s<big>the students\' books</big>add \' after s</div><div>Irregular plural<big>the children\'s toys</big>add \'s</div></div></div>','<div class="card"><p>Use o apóstrofo para mostrar quem é o dono.</p><div class="tripl"><div>Singular<big>Lucas\'s backpack</big>acrescente \'s</div><div>Plural com -s<big>the students\' books</big>apóstrofo depois do s</div><div>Plural irregular<big>the children\'s toys</big>acrescente \'s</div></div></div>'),build:()=>[apEx(),apEx(),apEx(),apEx(),apEx(),apRewrite(),apRewrite(),apSort(),apSort()]};

function pwSort(){return SO('Parts of a persuasive text','Sort the sentence starters by <b>part of the text</b>.','Separe os inícios de frase pela <b>parte do texto</b>.',[['i','Introduction','state your opinion'],['b','Body','reasons and examples'],['c','Conclusion','restate your opinion']],[pick(PW.filter(x=>x[1]==='i')),pick(PW.filter(x=>x[1]==='i')),pick(PW.filter(x=>x[1]==='b')),pick(PW.filter(x=>x[1]==='b')),pick(PW.filter(x=>x[1]==='c')),pick(PW.filter(x=>x[1]==='c'))].filter((v,i,a)=>a.findIndex(w=>w[0]===v[0])===i),t=>'<b>'+t.t+'</b> goes in the '+({i:'introduction (state your opinion)',b:'body (reasons and examples)',c:'conclusion (restate your opinion)'})[t.b]+'.','Introduction: opinion. Body: reasons and examples. Conclusion: restate the opinion.','Introdução: opinião. Corpo: razões e exemplos. Conclusão: repetir a opinião.')}

function gregoSort(){return SOP('Partes da pólis','Arraste cada elemento para a parte da cidade grega.',[['a','Acrópole','parte alta'],['b','Cidade baixa','parte baixa']],[['Templos','a'],['Fortificação','a'],['Moradias','b'],['Ágora','b'],['Comércio','b']],t=>'<b>'+t.t+'</b> '+(t.b==='a'?'fica na acrópole, a parte alta e protegida.':'fica na cidade baixa.'),'Acrópole: alto, templos e defesa. Cidade baixa: casas, comércio e ágora.')}
const HM1={id:'h1',guide:'nico',mins:6,title:'Grécia Antiga: as poleis',lesson:'<div class="card"><p>Os gregos antigos eram os <b>helenos</b>. Chamavam de <b>bárbaros</b> os povos estrangeiros. Fundaram <b>colônias</b> à procura de terras e comércio.</p><p>Cada cidade independente era uma <b>pólis</b> (cidade-Estado), com a <b>acrópole</b> (parte alta, templos, defesa) e a <b>cidade baixa</b> (casas, comércio e a <b>ágora</b>, praça pública).</p></div>',build:()=>GRQ.concat([gregoSort(),gregoSort()])};
const DEQ=[
 QP('Democracia: origem','O que significa a palavra <b>democracia</b>?',['Governo do povo (demos = povo, kratos = poder)','Governo de um rei','Governo dos militares','Governo dos deuses'],'Democracia vem do grego: demos (povo) e kratos (poder).'),
 QP('Aristocracia','Antes da democracia, quem governava Atenas?',['A aristocracia (poucas famílias ricas e poderosas)','Todos os cidadãos','Os escravizados','Os estrangeiros'],'Antes, poucas famílias ricas, a aristocracia, concentravam o poder.'),
 QP('Sólon','Qual a importância de <b>Sólon</b>?',['Criou a Eclésia (assembleia) e deu mais direitos aos cidadãos','Fundou Roma','Construiu as pirâmides','Descobriu a América'],'Há cerca de 2.600 anos, Sólon criou a Eclésia e fez reformas que abriram a participação.'),
 QP('Clístenes','O que fez <b>Clístenes</b>?',['Aprofundou a democracia em Atenas','Acabou com todas as leis','Conquistou o Egito','Fundou Axum'],'Clístenes aprofundou a democracia, dando ainda mais poder à assembleia.'),
 QP('Eclésia','O que era a <b>Eclésia</b>?',['A assembleia de cidadãos que debatia e votava','Um tipo de navio','Um templo para a deusa Atena','Um exército'],'Na Eclésia os cidadãos votavam leis e decisões.'),
 QP('Quem era cidadão','Quem era considerado <b>cidadão</b> em Atenas?',['Homens livres, filhos de pai e mãe atenienses','Todas as pessoas que moravam em Atenas','Mulheres e escravizados','Estrangeiros'],'Só homens nascidos de pai e mãe atenienses participavam da política.'),
 QP('Excluídos','Quem NÃO podia participar das decisões políticas em Atenas?',['Mulheres, metecos (estrangeiros) e escravizados','Homens atenienses livres','Os cidadãos','Os membros da Eclésia'],'A democracia ateniense excluía a maioria da população.'),
 QP('Limite da democracia','Por que a democracia ateniense era limitada?',['Porque só uma parte da população era considerada cidadã','Porque ninguém votava','Porque não existia assembleia','Porque havia rei'],'Só os cidadãos votavam; mulheres, estrangeiros e escravizados ficavam de fora.')];
function cidSort(){return SOP('Cidadão ou não?','Em Atenas, quem podia votar?',[['c','Cidadãos (votam)'],['n','Não cidadãos (não votam)']],[['Homem livre, filho de pai e mãe atenienses','c'],['Mulher ateniense','n'],['Meteco (estrangeiro)','n'],['Pessoa escravizada','n'],['Homem ateniense adulto livre','c']],t=>'<b>'+t.t+'</b>: '+(t.b==='c'?'tinha direito de votar na assembleia.':'não tinha direito de votar.'),'Cidadãos: homens livres, filhos de pai e mãe atenienses.')}
const HM2={id:'h2',guide:'duda',mins:7,title:'Democracia em Atenas',lesson:'<div class="card"><p>No início, Atenas era governada pela <b>aristocracia</b>. Há cerca de 2.600 anos, <b>Sólon</b> criou a <b>Eclésia</b> (assembleia). Depois, <b>Clístenes</b> aprofundou a <b>democracia</b> (governo do povo).</p><p>Só eram <b>cidadãos</b> os homens livres, filhos de pai e mãe atenienses. <b>Mulheres, metecos e escravizados</b> ficavam de fora.</p></div>',build:()=>DEQ.concat([cidSort(),cidSort()])};

 QP('Loba','No mito de Roma, quem salvou os bebês Rômulo e Remo no rio Tibre?',['Uma loba','Uma águia','Um touro','Um leão'],'Uma loba salvou os gêmeos e, mais tarde, um pastor os criou.'),

 QP('Fim da monarquia','Por que a monarquia chegou ao fim?',['Houve uma revolta contra o abuso do poder real','O rei venceu todas as guerras','Não havia mais cidades','Os gregos invadiram'],'Os romanos se revoltaram contra o abuso do poder dos reis.'),
 QP('República','O que significa <b>res publica</b>?',['Coisa pública','Coisa do rei','Coisa do inimigo','Cidade alta'],'A República é o governo em que o poder é compartilhado e pertence ao povo, em tese.'),
 QP('Patrícios','Quem eram os <b>patrícios</b>?',['Ricos proprietários de terras, descendentes dos fundadores de Roma','Os escravizados','Os trabalhadores comuns','Os estrangeiros'],'Os patrícios eram a aristocracia romana.'),

 QP('Cônsules','Quantos <b>cônsules</b> os patrícios elegiam na República?',['Dois','Um','Cinco','Cem'],'Eram dois cônsules, para evitar poder demais nas mãos de um só.'),
 QP('Assembleia Popular','Qual instituição deu mais voz à plebe?',['A Assembleia Popular','O rei','O exército','A acrópole'],'A Assembleia Popular elegia magistrados e votava leis.')];
function romaSort(){return SOP('Monarquia ou República?','Separe as características de cada forma de governo em Roma.',[['m','Monarquia'],['r','República']],[['Governada por reis','m'],['Senado aconselha o rei','m'],['Dois cônsules','r'],['Assembleia Popular','r'],['Patrícios elegem os cônsules','r'],['Poder concentrado em um rei','m']],t=>'<b>'+t.t+'</b> é da '+(t.b==='m'?'monarquia.':'república.'),'Monarquia: rei. República: cônsules, Senado e Assembleia Popular.')}
const HM3={id:'h3',guide:'rafa',mins:7,title:'Roma Antiga: monarquia e república',lesson:'<div class="card"><p>Roma foi fundada há cerca de <b>2.770 anos</b>. O mito conta de <b>Rômulo e Remo</b>. No início era uma <b>monarquia</b> (reis, com o Senado aconselhando). Uma revolta contra o abuso de poder criou a <b>República</b> (res publica, "coisa pública"): os <b>patrícios</b> elegiam <b>dois cônsules</b>, e a <b>plebe</b> ganhou voz na <b>Assembleia Popular</b>.</p></div>',build:()=>ROQ.concat([romaSort(),romaSort()])};
const CUQ=[
 QP('Onde fica','Onde ficava o Reino de Cuxe?',['Na Núbia, ao sul do Egito','Na Grécia','Na Itália','No Brasil'],'Cuxe ficava na Núbia, ao sul do Egito, no nordeste da África.'),
 QP('Independência','Há cerca de quanto tempo os povos núbios se tornaram independentes do Egito?',['Cerca de 4.400 anos','Cerca de 400 anos','Cerca de 40 anos','Cerca de 44.000 anos'],'Os núbios se tornaram independentes há cerca de 4.400 anos e formaram o Reino de Cuxe.'),
 QP('Capitais','Quais foram as capitais do Reino de Cuxe?',['Kerma, Nápata e Méroe','Atenas, Esparta e Roma','Adúlis, Axum e Cairo','Brasília, Goiânia e Salvador'],'Capitais: Kerma, Nápata e Méroe.'),
 QP('Pirâmides','Quantas pirâmides foram construídas em Méroe?',['Mais de 260','Cerca de 10','Cerca de 3','Nenhuma'],'Em Méroe há mais de 260 pirâmides, mais baixas que as egípcias.'),
 QP('Faraós negros','Por que os reis de Cuxe ficaram conhecidos como "faraós negros"?',['Porque reconquistaram o Egito e governaram por cerca de cem anos','Porque pintavam as pirâmides de preto','Porque eram gregos','Porque fundaram Roma'],'Há cerca de 3.600 anos, Cuxe reconquistou o Egito e uma dinastia de "faraós negros" governou por cerca de cem anos.'),
 QP('Candace','Quem era a <b>candace</b>?',['Mãe ou esposa do rei, com forte influência no governo','Um tipo de pirâmide','Um soldado','Um comerciante'],'Candace significa "senhora de Cuxe". As mulheres tinham grande poder e prestígio.'),
 QP('Economia de Cuxe','De que vivia a economia de Cuxe?',['Agricultura, criação de animais e comércio de ouro, marfim e ébano','Só de pesca','Só de turismo','Só de roubo'],'Trigo, cevada, sorgo, criação de animais e comércio de ouro, marfim, ébano, penas de avestruz e peles.')];

 QP('Axum: poder','De onde vinha o poder de Axum?',['Do controle de importantes redes comerciais entre Oriente e Ocidente','Da construção de pirâmides','Da democracia de Atenas','Da exploração de petróleo'],'Axum controlava rotas pelo Mar Vermelho e Oceano Índico.'),
 QP('Adúlis','O que era <b>Adúlis</b>, na atual Eritreia?',['A capital e um porto famoso de onde se vendiam marfim, ouro e incenso','Uma pirâmide','Uma assembleia','Um rei'],'Segundo a sua folha, a capital Adúlis era um porto famoso.'),
 QP('Moeda','Qual invenção facilitou o comércio de Axum?',['A moeda axumita, em prata, ouro ou bronze','O papel-moeda digital','A pólvora','A imprensa'],'Os axumitas cunharam moedas.'),
 QP('Ezana','O que aconteceu por volta do ano 330, sob o rei Ezana?',['Axum se converteu ao cristianismo','Axum foi destruído por Roma','Axum passou a ser uma república grega','Axum foi governado por Roma'],'Ezana converteu Axum ao cristianismo.'),
 QP('Igrejas','Qual igreja cristã é a mais notável construída pelos axumitas?',['Santa Maria de Sião','Catedral de Notre-Dame','Basílica de São Pedro','Igreja da Sé'],'Os axumitas foram excelentes construtores e ergueram igrejas cristãs.'),
 QP('Axum e Cuxe','No século III, Axum já exercia grande influência, inclusive sobre…',['o Reino de Cuxe','a Grécia','o Brasil','o Império Romano inteiro'],'Axum chegou a influenciar o Reino de Cuxe.')];
function afSort(){return SOP('Cuxe ou Axum?','Ligue cada informação ao reino africano.',[['c','Cuxe'],['a','Axum']],[['Pirâmides em Méroe','c'],['Candace','c'],['Faraós negros','c'],['Rei Ezana','a'],['Igreja de Santa Maria de Sião','a'],['Porto de Adúlis','a'],['Núbia, ao sul do Egito','c'],['Norte da Etiópia','a']],t=>'<b>'+t.t+'</b> é de '+(t.b==='c'?'Cuxe.':'Axum.'),'Cuxe: Núbia, pirâmides, candace, faraós negros. Axum: Etiópia, comércio, Ezana, cristianismo.')}
const HM4={id:'h4',guide:'leo',mins:7,title:'África Antiga: Reino de Cuxe',lesson:'<div class="card"><p>O <b>Reino de Cuxe</b> ficava na <b>Núbia</b>, ao sul do Egito. Tornou-se independente há cerca de <b>4.400 anos</b>. Capitais: <b>Kerma, Nápata e Méroe</b>. Em Méroe há mais de <b>260 pirâmides</b>. Há cerca de 3.600 anos reconquistou o Egito, com os <b>faraós negros</b>. A <b>candace</b> (mãe ou esposa do rei) tinha grande poder.</p></div>',build:()=>CUQ.concat([afSort(),afSort()])};
const HM5={id:'h5',guide:'bruno',mins:7,title:'África Antiga: Império de Axum',lesson:'<div class="card"><p>O <b>Império de Axum</b> surgiu por volta do <b>século I</b>, no norte da <b>Etiópia</b>. Controlava redes de <b>comércio</b> entre Oriente e Ocidente (Mar Vermelho e Oceano Índico). Criou a <b>moeda axumita</b>. Por volta do ano <b>330</b>, sob o rei <b>Ezana</b>, converteu-se ao <b>cristianismo</b> e construiu igrejas, como a de <b>Santa Maria de Sião</b>.</p></div>',build:()=>AXQ.concat([afSort(),afSort(),romaSort()].slice(0,2))};
const HIM=[HM1,HM2,HM3,HM4,HM5];

const TXB={
 brasil1:{t:'As Regiões Brasileiras',h:'<p>O Brasil é um país extenso e diverso, com uma grande variedade de paisagens e modos de vida. Para facilitar o estudo e a organização de seu território, os estados brasileiros são agrupados em cinco Grandes Regiões: <mark>Norte, Nordeste, Centro-Oeste, Sudeste e Sul</mark>.</p><p>Cada região apresenta características próprias de <mark>clima, relevo, vegetação, rios, população, cultura e atividades econômicas</mark>. Essa diversidade contribui para a riqueza natural e cultural do nosso país.</p>'},
 brasil2:{t:'País continental',h:'<p>O Brasil é chamado de <mark>país continental</mark> porque possui um <mark>território muito extenso</mark>, que ocupa uma grande parte da América do Sul. Suas dimensões territoriais contribuem para a existência de diferentes climas, paisagens naturais, formas de relevo e modos de vida, que variam de uma região para outra.</p>'},
 norte:{t:'Região Norte',h:'<p>A Região Norte é <mark>a maior do Brasil em extensão territorial</mark> e abriga grande parte da <mark>Floresta Amazônica</mark>, conhecida por sua enorme biodiversidade. A <mark>Linha do Equador</mark> atravessa essa região. Em muitas áreas predomina o <mark>clima equatorial</mark>, quente e úmido.</p><p>O extrativismo vegetal e mineral é importante para a economia de vários lugares. <mark>Açaí, castanha e madeira</mark> são exemplos de recursos vegetais; <mark>ferro, bauxita, ouro e manganês</mark> são minerais encontrados na região. A exploração precisa ser feita com <mark>responsabilidade</mark>, respeitando as florestas, os rios e os direitos dos povos indígenas e das comunidades locais.</p>'},
 co:{t:'Região Centro-Oeste',h:'<p>O Centro-Oeste reúne <mark>Goiás (GO), Mato Grosso (MT), Mato Grosso do Sul (MS) e o Distrito Federal (DF)</mark>, onde fica <mark>Brasília</mark>, capital do Brasil. A inauguração de Brasília, em <mark>1960</mark>, e a abertura de estradas ajudaram a conectar a região a outras partes do país e atraíram moradores e atividades econômicas.</p><p>O <mark>Cerrado</mark> é um bioma marcante da região. Com novas tecnologias, cresceram a <mark>agricultura e a pecuária</mark>. Essas mudanças ampliaram a produção, mas também trouxeram desafios, como a conservação do solo, das nascentes e da vegetação nativa.</p>'},
 ne:{t:'Região Nordeste',h:'<p>O Nordeste é formado por <mark>nove estados</mark> e possui grande diversidade de paisagens, culturas e atividades. O turismo, a agricultura, o comércio e muitos outros setores participam das economias locais. A região também guarda importantes patrimônios históricos. <mark>Salvador, Olinda e São Luís</mark>, por exemplo, têm <mark>centros históricos</mark> com construções de diferentes épocas.</p><p>A <mark>colonização portuguesa</mark> deixou marcas na arquitetura e na organização de algumas cidades. É importante reconhecer essas marcas junto das contribuições <mark>indígenas, africanas</mark> e de tantos outros grupos que formaram e continuam formando a cultura brasileira.</p>'},
 se:{t:'Região Sudeste',h:'<p>O Sudeste é a região <mark>mais populosa e urbanizada</mark> do país. Grandes cidades, como <mark>São Paulo, Rio de Janeiro e Belo Horizonte</mark>, concentram atividades de <mark>comércio, serviços e indústria</mark>. A economia também inclui agropecuária e mineração.</p><p>Ao longo do tempo, a oferta de empregos, serviços e oportunidades atraiu pessoas de várias regiões do Brasil e de outros países. Migrações e encontros culturais contribuíram para a diversidade da população. Ao mesmo tempo, cidades grandes precisam planejar <mark>moradia, transporte, saneamento e áreas verdes</mark>.</p>'},
 sul:{t:'Região Sul',h:'<p>O Sul é a <mark>menor região brasileira</mark> em extensão territorial. É formado por <mark>Paraná (PR), Santa Catarina (SC) e Rio Grande do Sul (RS)</mark>. Sua economia combina agricultura, pecuária, agroindústria, indústria, comércio, serviços e produção de energia. Entre os produtos agrícolas estão <mark>milho, arroz, soja, maçã e cebola</mark>.</p><p>A região tem conexões com países vizinhos e apresenta paisagens e culturas variadas. A <mark>Usina de Itaipu</mark>, no Rio Paraná, é uma importante usina hidrelétrica compartilhada por <mark>Brasil e Paraguai</mark>. A produção de energia também exige planejamento para equilibrar as necessidades humanas e os impactos ambientais.</p>'},
 gr1:{t:'A Grécia Antiga',h:'<p>A Grécia Antiga formou-se da união de diferentes povos que viviam na região dos Bálcãs, na península do Peloponeso e no litoral do mar Egeu. Nessas regiões, a língua falada era o <mark>grego</mark>, que apresentava algumas variações em cada comunidade. Os habitantes dessas comunidades se autodenominavam <mark>helenos</mark> e chamavam de <mark>“bárbaros”</mark> todos os povos que não falassem grego.</p>'},
 gr2:{t:'Comércio e colônias gregas',h:'<p>Por sua localização, a Grécia Antiga tinha o <mark>comércio marítimo</mark> como principal atividade econômica. O <mark>crescimento populacional</mark> e a busca de ampliação das atividades comerciais estimularam a fundação de <mark>colônias</mark> gregas do sul da península Itálica (chamada de Magna Grécia), na costa do mar Negro, no norte da África e em parte da Ásia. Nessas regiões, os gregos difundiram sua cultura e seus costumes.</p>'},
 gr3:{t:'O surgimento das poleis',h:'<p>Há cerca de 2.800 anos, a população da Grécia Antiga cresceu, contribuindo para o surgimento de novas cidades, chamadas de <mark>poleis</mark> (cidades-Estado). Elas eram <mark>independentes</mark>, cada uma com constituição própria, mas tinham algumas similaridades.</p><p>Na área urbana, havia uma parte mais alta, chamada de <mark>acrópole</mark>, onde se localizavam os templos dos deuses. Na parte baixa da área urbana, chamada de <mark>cidade baixa</mark>, ficavam o mercado, as praças e as moradias. Na <mark>ágora</mark>, a praça principal, os gregos debatiam sobre política e outros assuntos.</p><p>Esparta e Atenas eram poleis com grande destaque entre as outras cidades-Estado, cada uma com características específicas. <mark>Esparta</mark> era marcada pelo militarismo. <mark>Atenas</mark>, por sua vez, ficou marcada pelo nascimento da democracia.</p>'},
 de1:{t:'Democracia em Atenas (1)',h:'<p>Inicialmente, muitas cidades-Estado gregas (poleis) eram governadas por uma <mark>aristocracia</mark>, um grupo privilegiado que limitava a participação popular nas decisões. Isso gerou uma grande tensão social devido à exclusão de camponeses, artesãos e comerciantes do poder.</p><p>Para resolver essa situação, o legislador <mark>Sólon</mark>, por volta de <mark>2.600 anos atrás</mark>, instituiu reformas, criando a <mark>Eclésia</mark>, uma assembleia popular da qual podiam participar todos os cidadãos atenienses maiores de 18 anos.</p>'},
 de2:{t:'Democracia em Atenas (2)',h:'<p>Mais tarde, o governante e legislador <mark>Clístenes</mark> aprofundou as reformas, implantando a democracia de fato. Na Eclésia de Clístenes, todos os homens, ricos e pobres, tinham direito à participação direta, podendo debater e tomar decisões sobre os assuntos políticos da cidade. Por essa razão, a democracia ateniense é considerada <mark>direta</mark>.</p><p>No entanto, essa participação era <mark>restrita</mark>. Apenas os <mark>homens filhos de pai e mãe atenienses</mark> eram considerados cidadãos. <mark>Mulheres, estrangeiros (metecos) e escravizados</mark> continuavam excluídos da vida política da pólis.</p>'},
 ro1:{t:'Roma Antiga: a fundação',h:'<p>A cidade de Roma foi fundada na Península Itálica a partir da união de diferentes povos, como os <mark>latinos, etruscos e samnitas</mark>. Esses povos desenvolveram a agricultura, a criação de animais, o artesanato e o comércio marítimo.</p><p>De acordo com pesquisas arqueológicas, a fundação de Roma ocorreu há cerca de <mark>2.770 anos</mark> (aproximadamente no século VIII a.C.). Segundo o mito, Roma foi fundada pelos gêmeos <mark>Rômulo e Remo</mark>, filhos da união entre uma mortal e o deus Marte. Abandonados no rio Tibre quando bebês, eles foram salvos por uma <mark>loba</mark> e, mais tarde, encontrados e criados por um pastor e sua esposa. Quando adultos, os gêmeos descobriram suas origens e fundaram a cidade de Roma.</p>'},
 ro2:{t:'Roma Antiga: a Monarquia',h:'<p>No início, Roma foi uma <mark>monarquia</mark>, governada por reis. Durante a Monarquia Romana, o <mark>Senado</mark> era responsável por <mark>aconselhar os reis, criar leis e limitar o poder real</mark>. Seus membros eram de famílias tradicionais e, inicialmente, eram escolhidos pelos mais velhos.</p>'},
 ro3:{t:'Roma Antiga: a República',h:'<p>A monarquia chegou ao fim devido a uma <mark>revolta contra o abuso do poder real</mark>. Em seguida, Roma tornou-se uma <mark>República</mark> (<i>res publica</i>, que significa “coisa pública”).</p><p>Na República, o poder passou às mãos dos <mark>patrícios</mark> (membros ricos da aristocracia, proprietários de terras e descendentes dos fundadores de Roma). Eles elegiam <mark>dois cônsules</mark> para presidir o Senado e as assembleias populares. Com o tempo, a <mark>plebe</mark> (grupo envolvido no comércio, artesanato, agricultura etc.) começou a ter mais voz na política romana, principalmente através da <mark>Assembleia Popular</mark>, que elegia magistrados e votava leis.</p>'},
 cu1:{t:'O Reino de Cuxe',h:'<p>O <mark>Reino de Cuxe</mark>, localizado na <mark>Núbia</mark> (ao sul do Egito), surgiu da união de povos núbios que se tornaram independentes do Egito há cerca de <mark>4.400 anos</mark>, com capitais em <mark>Kerma, Nápata e Méroe</mark>.</p><p>A economia cuxita baseava-se na agricultura (trigo, cevada, sorgo), na criação de animais e no comércio de ouro, marfim, ébano, penas de avestruz e peles de leopardo. Foram construídas <mark>mais de 260 pirâmides em Méroe</mark> para reis e rainhas cuxitas, embora fossem mais baixas que as egípcias.</p>'},
 cu2:{t:'Cuxe: faraós negros e candaces',h:'<p>Por volta de <mark>3.600 anos atrás</mark>, o Reino de Cuxe reconquistou o Egito, estabelecendo uma dinastia de <mark>“faraós negros”</mark> que governou por cerca de cem anos, até ser expulsa pelos egípcios.</p><p>No Reino de Cuxe, as mulheres desfrutavam de uma posição de grande poder e prestígio. A mãe ou a esposa do rei recebia o título de <mark>candace</mark>, ou seja, “senhora de Cuxe”, e exercia forte influência no governo.</p>'},
 ax1:{t:'O Império de Axum',h:'<p>O <mark>Império de Axum</mark> surgiu por volta do <mark>século I</mark>, no <mark>norte da Etiópia</mark>, e se tornou um dos reinos africanos mais importantes da região. No século III, Axum já exercia grande influência, inclusive sobre o Reino de Cuxe.</p><p>O poder de Axum vinha do controle de importantes <mark>redes comerciais</mark> que ligavam o Oriente ao Ocidente, incluindo o Mar Vermelho e o Oceano Índico. Os axumitas viviam da agricultura (cultivo de cereais) e da criação de animais (bois, cabras e ovelhas).</p>'},
 ax2:{t:'Axum: comércio e cristianismo',h:'<p>A capital, <mark>Adúlis</mark>, na atual Eritreia, era um <mark>porto famoso</mark> de onde os axumitas vendiam marfim, ouro, gado, incenso, chifres de rinocerontes e escravizados. Em troca, eles importavam mercadorias de povos do Oriente (como indianos e chineses) e produtos europeus (como vinho e azeite). Para facilitar o comércio, eles desenvolveram a <mark>moeda axumita</mark>, cunhada em prata, ouro ou bronze.</p><p>O intenso comércio e as trocas culturais levaram Axum a se converter ao <mark>cristianismo</mark> por volta do ano <mark>330</mark>, sob o governo do rei <mark>Ezana</mark>. Os axumitas eram excelentes construtores e passaram a edificar igrejas cristãs, sendo a de <mark>Santa Maria de Sião</mark> a mais notável.</p>'}
};

function gateEx(ex){const ks=refKeys(ex.ref).filter(k=>TXB[k]);if(!ks.length)return;const a=$('#area');if(!a)return;
 const words=ks.reduce((s,k)=>s+wc(TXB[k].h),0);

 a.classList.add('lock');try{a.inert=true}catch(e){}
 const g=document.createElement('div');g.className='gate';g.innerHTML='<span>'+(RUN.m.boss?'Pense primeiro…':'Leia o trecho com calma…')+'</span><div class="gb"><i></i></div>';a.parentNode.insertBefore(g,a);
 const bar=g.querySelector('i');requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transitionDuration=T+'s';bar.style.width='100%'}));
 setTimeout(()=>{if(!g.isConnected)return;g.remove();a.classList.remove('lock');try{a.inert=false}catch(e){}const ni=$('#ni');if(ni)try{ni.focus({preventScroll:true})}catch(e){}},T*1000)}

 const iv=setInterval(()=>{const go=$('#go');if(!go){clearInterval(iv);return}const el=(Date.now()-t0)/1000,left=Math.max(0,Math.ceil(T-el));
  $('#rgi').style.width=Math.min(100,el/T*100)+'%';$('#rgt').textContent=left>0?'Leia com calma. Faltam '+left+' s para liberar o botão.':'Pronto! Quando terminar de ler, toque no botão.';
  if(left<=0){go.disabled=false;clearInterval(iv)}},250)}

 {id:'p2',guide:'nico',mins:7,title:'Artigos definidos e indefinidos',lesson:'<div class="card"><p><b>Artigos</b> acompanham o substantivo e concordam com ele em gênero e número.</p><div class="tripl"><div><b>Definidos</b><br>algo conhecido<big>o, a, os, as</big>o gol, as bolas</div><div><b>Indefinidos</b><br>algo qualquer<big>um, uma, uns, umas</big>um jogo, umas camisas</div></div></div>',build:()=>[artEx(),artEx(),artEx(),artEx(),artType(),artType(),artType(),artSort()].concat(ARTQ)},
 {id:'p3',guide:'leo',mins:8,title:'Palavras homônimas',lesson:'<div class="card"><p><b>Homônimas</b> são palavras com <b>mesmo som</b> ou <b>mesma escrita</b>, mas <b>significados diferentes</b>.</p><div class="tripl"><div><b>manga</b><big>fruta</big>manga da camisa</div><div><b>sede</b><big>vontade de beber</big>local da empresa</div><div><b>banco</b><big>assento</big>dinheiro</div></div><p>Outros pares: <b>cela / sela</b> (prisão / do cavalo), <b>cem / sem</b>, <b>cesta / sexta</b>, <b>conserto / concerto</b>, <b>assento / acento</b>, <b>coser / cozer</b>. Para escolher, olhe o <b>contexto</b> da frase.</p></div>',build:()=>[hmEx(),hmEx(),hmEx(),hmEx(),hfEx(),hfEx(),hfEx(),hfEx(),hmSort()].concat(HQ)},

 out.push({id:'boss'+gi,boss:true,lang:g[1],guide:['rafa','nico','leo','duda'][gi%4],mins:9,title:g[1]==='en'?B('Final: '+(g[2]||'Mixed'),'Final: '+(g[3]||'mistura')):'Final: '+(g[3]||'do dia'),lesson:null,build:()=>sample([].concat.apply([],ms.map(m=>m.build())),12)})});return out}

let beat=null;
function dance(){const ov=$('#over');let left=20;
 ov.innerHTML='<div class="dance" role="dialog" aria-label="Comemoração"><h2>Comemoração!</h2><p class="lead">Levanta, corre pelo gramado e comemora por 20 segundos. Aproveite para beber água.</p><div class="dcr">'+Object.keys(MEM).map(k=>avatar(k,64)).join('')+'</div><div class="eq" aria-hidden="true">'+'<i></i>'.repeat(14)+'</div><div class="dtime" id="dt">20</div><button class="ghost" id="dskip">Voltar</button></div>';
 let i=0;const a=ac();
 const step=()=>{i++;if(a){tone(i%2?70:90,0,.18,'sine',.3);tone([523,659,784,659][i%4],0,.2,'square',.05);if(i%2===0)tone(2200,0,.03,'square',.03)}};
 beat=setInterval(step,300);
 const tm=setInterval(()=>{left--;const el=$('#dt');if(el)el.textContent=left;if(left<=0)stop()},1000);
 function stop(){clearInterval(beat);clearInterval(tm);ov.innerHTML=''}
 $('#dskip').onclick=stop}

/* ---------- início de missão ---------- */
function startMission(d,m){RUN_DAY=d;LANG=m.lang||d.lang||'pt';document.body.classList.toggle('alt-on',LANG==='en'&&!!S.alt);
 if(m.lesson&&!m.boss){const l=m.lesson;
  MAIN.innerHTML='<section class="lesson"><div class="row"><button class="ghost sm" id="quit">Sair</button>'+(LANG==='en'?'<button class="ghost sm" id="altb">Ver em português</button>':'')+'</div><div class="guide">'+avatar(m.guide,56)+'<div><div class="kick">'+MEM[m.guide].n+' · '+MEM[m.guide].r+'</div><h2>'+mtitle(m,LANG)+'</h2></div></div>'+readBox(m)+(typeof l==='string'?l:(LANG==='en'?l.en+'<div class="alt">'+l.pt+'</div>':l.pt))+'<div><button class="btn" id="go"'+(m.texts?' disabled':'')+'>'+(m.texts?'Li o texto, bora!':'Entendi, bora!')+'</button> <span class="lead"> · cerca de '+m.mins+' min</span></div></section>';
  $('#quit').onclick=()=>{location.hash='#'+d.id;route()};
  const ab=$('#altb');if(ab){ab.textContent=S.alt?'Esconder português':'Ver em português';ab.onclick=()=>{S.alt=!S.alt;save();document.body.classList.toggle('alt-on',S.alt);ab.textContent=S.alt?'Esconder português':'Ver em português'}}
  $('#go').onclick=()=>begin();if(m.texts)gateRead(m);window.scrollTo(0,0)}
 else begin();
 function begin(){const q=attachRef(dedupeQ(m.build()));RUN={m,queue:q.slice(),idx:0,res:[],start:Date.now()};showEx()}}

/* =======================================================
   TELAS
======================================================= */
function renderSide(){const rec=recDay(),cur=location.hash.slice(1);
 $('#me').innerHTML='<div><b>Otávio</b><div class="dp">'+Object.keys(S.stars).filter(k=>S.stars[k]>0).length+' missões feitas</div></div>'+stars(Math.min(3,Math.round(Object.values(S.stars).reduce((a,b)=>a+b,0)/Math.max(1,Object.keys(S.stars).length))||0));
 $('#days').innerHTML=DAYS.map(d=>'<a class="day'+(cur===d.id?' on':'')+'" href="#'+d.id+'"><div class="dt">'+d.dow.slice(0,3).toUpperCase()+'<small>'+d.date+'</small></div><div><div class="dn">'+d.name+(d.id===rec.id?'<span class="tag rec">próxima</span>':'')+(d.soon?'<span class="tag soon">em breve</span>':'')+'</div><div class="dp">'+(d.soon?'chega nas próximas rodadas':'missões '+dayDone(d))+'</div></div></a>').join('');
 $('#l-album').classList.toggle('on',cur==='album');$('#l-pais').classList.toggle('on',cur==='pais');
 $('#snd').textContent=S.sound?'Ligado':'Desligado';$('#snd').setAttribute('aria-pressed',S.sound)}
function home(){const rec=recDay(),n=daysTo(rec);
 MAIN.innerHTML='<section class="hero"><div class="kick">Copa Year 5</div><h1>Bem-vindo ao estádio, Otávio!</h1><p class="lead">Um jogo por vez, de 6 a 10 minutos. Os erros voltam no final para você fixar, e cada jogo vence uma figurinha do seu time.</p></section>'
 +'<div class="card" style="max-width:720px"><div class="kick">Próxima prova</div><h2>'+rec.dow+' '+rec.date+': '+rec.name+'</h2><p class="lead">'+(n>0?'Faltam '+n+' dia'+(n>1?'s':''):'É hoje')+'. '+(rec.soon?'Este dia chega nas próximas rodadas.':'Comece pela primeira missão.')+'</p><a class="btn" href="#'+rec.id+'">'+(rec.soon?'Ver o que vai cair':'Entrar em campo')+'</a></div>'
 +'<h2 style="margin:28px 0 12px">Conheça o seu time</h2><div class="pgrid">'+Object.keys(MEM).map(k=>'<div class="pc" style="--c:'+MEM[k].c+'"><div class="pcav">'+avatar(k,76)+'</div><b>'+MEM[k].n+'</b><small>'+MEM[k].r+'</small></div>').join('')+'</div><p class="lead" style="margin-top:14px">Time inventado só para este site, sem clubes, escudos nem jogadores reais. Eles guiam as missões e torcem por você.</p>'}
function dayView(d){
 if(d.soon){MAIN.innerHTML='<section class="hero"><div class="kick">'+d.dow+' · '+d.date+'</div><h1>'+d.name+'</h1><p class="lead">Este dia ainda está sendo preparado e chega no mesmo link nas próximas rodadas. Enquanto isso, treine os dias que já estão abertos.</p></section><div class="card" style="max-width:720px"><h3>O que vai cair</h3><ul>'+d.topics.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>';return}
 const ms=missionsOf(d),l=d.lang;
 MAIN.innerHTML='<section class="hero"><div class="kick">'+d.dow+' · '+d.date+' · prova '+(d.id==='qui'?'(oficina)':'')+'</div><h1>'+d.name+'</h1><p class="lead">'+(d.mixed?'Ciências e Inglês têm exercícios em inglês, com botão para ver em português. Geografia e História são em português. Cada matéria termina com uma Final que mistura tudo.':l==='en'?'Exercises in English with a button to see Portuguese. Do one mission at a time. The Final mixes everything.':'Faça um jogo por vez. No final, a Final mistura tudo.')+'</p><div class="chips">'+d.topics.map(t=>'<span class="chp">'+t+'</span>').join('')+'</div></section>'
 +'<div class="mgrid">'+ms.map((m,i)=>{const s=S.stars[mid(d,m)]||0,ml=m.lang||l;return '<button class="mc'+(m.boss?' boss':'')+'" data-m="'+m.id+'">'+avatar(m.guide,46)+'<h3>'+mtitle(m,ml)+'</h3>'+(ml==='en'?'<div class="alt">'+T(m.title,'pt')+'</div>':'')+'<div class="meta">'+MEM[m.guide].n+' · ~'+m.mins+' min'+(m.boss?' · 12 questões misturadas':'')+'</div>'+(s?stars(s):'<span class="meta">ainda não feita</span>')+'</button>'}).join('')+'</div>';
 document.body.classList.toggle('alt-on',l==='en'&&!!S.alt);
 $$('.mc').forEach(b=>b.onclick=()=>startMission(d,ms.find(m=>m.id===b.dataset.m)))}
function albumView(){let h='<section class="hero"><div class="kick">Coleção</div><h1>Álbum de figurinhas</h1><p class="lead">Cada missão concluída libera uma figurinha. Com 3 estrelas, ela ganha borda brilhante.</p></section>';
 DAYS.filter(d=>!d.soon).forEach(d=>{h+='<h2 style="margin:22px 0 12px">'+d.dow+' · '+d.name+'</h2><div class="pgrid">'+missionsOf(d).map(m=>{const st=S.stars[mid(d,m)]||0,mem=MEM[m.guide];return '<div class="pc'+(st?'':' lock')+(st===3?' holo':'')+'" style="--c:'+mem.c+'"><div class="pcav">'+(st?avatar(m.guide,80):'?')+'</div><b>'+(st?mem.n:'???')+'</b><small>'+(st?mtitle(m,'pt'):'conclua a missão')+'</small>'+(st?stars(st):'')+'</div>'}).join('')+'</div>'});
 MAIN.innerHTML=h}
let resetArm=false,unsubP=null,REMOTE=null,PSTATE='';
function mergeLog(){const m={};(REMOTE||[]).forEach(e=>{m[e.t]=e});S.log.forEach(e=>{if(!m[e.t])m[e.t]=e});return Object.values(m).sort((a,b)=>b.t-a.t)}
const PNOTE={on:'Sincronizado: os resultados chegam aqui sozinhos assim que o Otávio termina cada missão.',off:'A sincronização não está disponível neste acesso. Mostrando só os resultados salvos neste navegador.',wait:'Buscando os resultados…',slow:'Ainda não consegui alcançar a base. Mostrando o que está salvo neste navegador.',err:'Não consegui alcançar a base agora. Mostrando o que está salvo neste navegador.','':''};
function drawParents(){const body=$('#pbody');if(!body)return;const L=mergeLog();const tot=L.reduce((a,e)=>a+e.n,0),okk=L.reduce((a,e)=>a+e.ok,0),mins=L.reduce((a,e)=>a+e.min,0);
 body.innerHTML='<p class="lead" id="pnote">'+(PNOTE[PSTATE]||'')+'</p><div class="row" style="margin:14px 0 18px"><div class="card"><div class="dp">Missões feitas</div><div class="big">'+L.length+'</div></div><div class="card"><div class="dp">Acerto de primeira</div><div class="big">'+(tot?Math.round(okk/tot*100):0)+'%</div></div><div class="card"><div class="dp">Tempo estudado</div><div class="big">'+mins+' min</div></div></div>'
 +(L.length?'<div class="act" style="margin:0 0 12px"><button class="btn cy" id="cpall">Copiar todos os relatórios</button><button class="ghost" id="rst">Apagar progresso</button></div><textarea class="rep" id="allrep" readonly style="display:none"></textarea>'+L.map(e=>{const dt=new Date(e.t);return '<details><summary>'+dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · '+e.title+' · '+e.ok+'/'+e.n+' · '+e.st+' estrela'+(e.st>1?'s':'')+'</summary>'+(e.wrong&&e.wrong.length?'<p>Para revisar:</p><ul>'+e.wrong.map(w=>'<li>'+String(w).replace(/</g,'&lt;')+'</li>').join('')+'</ul>':'<p>Sem erros.</p>')+'</details>'}).join(''):'<p class="lead">Ainda não há missões concluídas.</p>');
 const cp=$('#cpall');if(cp){const ta=$('#allrep');ta.value=L.map(reportText).join('\n\n———\n\n');ta.style.display='block';cp.onclick=()=>copyText(ta.value,cp,ta);
  const r=$('#rst');r.onclick=async()=>{if(!resetArm){resetArm=true;r.textContent='Tem certeza? Toque de novo';return}resetArm=false;const old=(REMOTE||[]).slice();S.stars={};S.log=[];REMOTE=[];save();renderSide();drawParents();
   const db=await getDb();if(db){for(const e of old){try{await db.doc('reports/r'+e.t).delete()}catch(x){break}}}}}}
function parentsView(){
 MAIN.innerHTML='<section class="hero"><div class="kick">Área dos pais</div><h1>Como o Otávio está indo</h1><p class="lead">Cada missão concluída envia o resultado para cá automaticamente, sem ela precisar fazer nada.</p></section><div id="pbody"></div>';
 PSTATE='';drawParents();
 getDb().then(db=>{if(location.hash!=='#pais')return;if(!db){PSTATE='off';drawParents();return}
  PSTATE='wait';drawParents();const timer=setTimeout(()=>{if(PSTATE==='wait'){PSTATE='slow';drawParents()}},10000);
  unsubP=db.collection('reports').orderBy('t','desc').limit(300).onSnapshot(snap=>{clearTimeout(timer);REMOTE=snap.docs.map(d=>d.data());PSTATE='on';drawParents()},()=>{clearTimeout(timer);PSTATE='err';drawParents()})})}

function route(){const h=location.hash.slice(1);RUN=null;if(unsubP){unsubP();unsubP=null}closeDrawer();$('#over').innerHTML='';if(beat)clearInterval(beat);
 const d=DAYS.find(x=>x.id===h);if(d){LANG=d.lang||'pt';document.body.classList.toggle('alt-on',LANG==='en'&&!!S.alt)}else{LANG='pt';document.body.classList.remove('alt-on')}
 if(d)dayView(d);else if(h==='album')albumView();else if(h==='pais')parentsView();else home();
 renderSide();window.scrollTo(0,0)}
function closeDrawer(){$('#side').classList.remove('open')}
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#snd').onclick=()=>{S.sound=!S.sound;save();renderSide()};
window.addEventListener('hashchange',route);
route();
flush();
})();
</script>

</body></html>
